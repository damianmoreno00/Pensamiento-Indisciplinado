cil juzgarla echando la vista atrás, pero en el momento no es tan fácil. ¿Cómo sabían las mujeres de los países Aliados que estaban apoyando a una guerra “justa”? «El análisis feminista del estado-nación ha dejado claro que la igualdad de género es imposible en principio dentro de un marco de modernidad, patriarcado y estado-nación» (pág 63). El Estado-nación está generizado, las mujeres han sido nacionalizadas. La pregunta que se formula Ueno es, ¿podemos ir más allá? (pág 64). ","kind":"paragraph"},{"html":"Un ejemplo claro de esto lo pone Ueno al citar a Ehara Yumiko que especuló sobre la visión de los hombres coreanos y japoneses que verían la violación de las mujeres como la violación del honor de sus respectivos países. Esta concepción parte de una premisa machista de que las mujeres pertenecen al Estado-nación y que violarlas, viola también al Estado y es una falta de respeto hacia los hombres de ese país también (pág 74). «Este ataque de los soldados se dirige ante todo a la sexualidad de las mujeres, pues los agresores saben que es una demostración de su poder, que simboliza el máximo insulto a los hombres del bando enemigo. Es precisamente por esta razón que la violación despierta una furia tan vehemente en los hombres del país enemigo» (pág 80). Así también se trazó la línea entre mujeres “puras” e “impuras”, mereciendo unas consuelo y otras no (pág 89). Esto es lo que Ueno denomina la «metáfora de la violación», la identificación de la nación con las mujeres y la transgresión hacia las mujeres como agresión al Estado-nación (pág 94). ","text":"Un ejemplo claro de esto lo pone Ueno al citar a Ehara Yumiko que especuló sobre la visión de los hombres coreanos y japoneses que verían la violación de las mujeres como la violación del honor de sus respectivos países. Esta concepción parte de una premisa machista de que las mujeres pertenecen al Estado-nación y que violarlas, viola también al Estado y es una falta de respeto hacia los hombres de ese país también (pág 74). «Este ataque de los soldados se dirige ante todo a la sexualidad de las mujeres, pues los agresores saben que es una demostración de su poder, que simboliza el máximo insulto a los hombres del bando enemigo. Es precisamente por esta razón que la violación despierta una furia tan vehemente en los hombres del país enemigo» (pág 80). Así también se trazó la línea entre mujeres “puras” e “impuras”, mereciendo unas consuelo y otras no (pág 89). Esto es lo que Ueno denomina la «metáfora de la violación», la identificación de la nación con las mujeres y la transgresión hacia las mujeres como agresión al Estado-nación (pág 94). ","kind":"paragraph"},{"html":"Volviendo al tema de la historia, Ueno declara que «la idea de una ‘historia oficial’ debe abandonarse. Desde dentro de la historia es posible escribir ‘otra historia’ de las minorías, los débiles y los oprimidos, aunque se trate de una sola persona» (pág 104). Siguiendo con este tema, se pregunta acerca de la corriente del positivismo en la historia. Esa corriente que, al no haber pruebas documentadas y desconfiar de los testimonios tiende a desacreditar las demandas de las mujeres de consuelo, ya que hay pocos documentos que no hayan sido destruidos y lo que queda son los testimonios de las propias víctimas (pág 110). ","text":"Volviendo al tema de la historia, Ueno declara que «la idea de una ‘historia oficial’ debe abandonarse. Desde dentro de la historia es posible escribir ‘otra historia’ de las minorías, los débiles y los oprimidos, aunque se trate de una sola persona» (pág 104). Siguiendo con este tema, se pregunta acerca de la corriente del positivismo en la historia. Esa corriente que, al no haber pruebas documentadas y desconfiar de los testimonios tiende a desacreditar las demandas de las mujeres de consuelo, ya que hay pocos documentos que no hayan sido destruidos y lo que queda son los testimonios de las propias víctimas (pág 110). ","kind":"paragraph"},{"html":"La pregunta, hacia el final de su libro, que se torna relevante es esta: ¿Puede el feminismo trascender el nacionalismo? «El objetivo del feminismo no es sustituir una categoría excluyente por otra. El objetivo no es construir una comunidad esencialista llamada <em>mujeres</em>. Así como no puedo ser reducida a la categoría de ‘mujer’, no me reduzcan a la de ‘sujeto nacional’. La intención es relativizar estas categorías» (pág 144). Hacia el final de este capítulo expresa una frase contundente con la que zanjar la cuestión de las guerras “justas” e “injustas”: «La guerra en sí misma es el crimen» (pág 146).  ","text":"La pregunta, hacia el final de su libro, que se torna relevante es esta: ¿Puede el feminismo trascender el nacionalismo? «El objetivo del feminismo no es sustituir una categoría excluyente por otra. El objetivo no es construir una comunidad esencialista llamada mujeres. Así como no puedo ser reducida a la categoría de ‘mujer’, no me reduzcan a la de ‘sujeto nacional’. La intención es relativizar estas categorías» (pág 144). Hacia el final de este capítulo expresa una frase contundente con la que zanjar la cuestión de las guerras “justas” e “injustas”: «La guerra en sí misma es el crimen» (pág 146).  ","kind":"paragraph"}],"bibliography":[{"html":"Jenkins, K. (2009). <em>Repensar la historia</em> (J. Izquierdo Martín, Trad.). Siglo XXI de España Editores. (Libro original publicado en 1991).","text":"Jenkins, K. (2009). Repensar la historia (J. Izquierdo Martín, Trad.). Siglo XXI de España Editores. (Libro original publicado en 1991)."},{"html":"Ueno, C. (2004). <em>Nationalism</em><em> and </em><em>gender</em> (B. Yamamoto, Trad.). Trans Pacific Press.","text":"Ueno, C. (2004). Nationalism and gender (B. Yamamoto, Trad.). Trans Pacific Press."}]},{"id":"nanda","name":"Meera Nanda","concept":{"es":"Científico","ca":"Científic"},"color":"#3ec6a8","blocks":[{"html":"El autor o autora que se podría situar en el inicio de la contemporaneidad en la filosofía es más que discutible. Hay quienes sitúan en ese inicio a Nietzsche. Habitualmente el paso de la modernidad filosófica a la contemporaneidad se da por el paso a la posmodernidad. ¿Qué es la posmodernidad? En palabras de Lyotard en su obra <em>La condición postmoderna</em><em> </em>(2000), quién acuñó el término: «Simplificando al máximo, se tiene por «postmoderna» la incredulidad con respecto a los metarrelatos» (pág 10). Los metarrelatos se podrían entender como narrativas que buscan explicar la totalidad del mundo y sus fenómenos. ","text":"El autor o autora que se podría situar en el inicio de la contemporaneidad en la filosofía es más que discutible. Hay quienes sitúan en ese inicio a Nietzsche. Habitualmente el paso de la modernidad filosófica a la contemporaneidad se da por el paso a la posmodernidad. ¿Qué es la posmodernidad? En palabras de Lyotard en su obra La condición postmoderna (2000), quién acuñó el término: «Simplificando al máximo, se tiene por «postmoderna» la incredulidad con respecto a los metarrelatos» (pág 10). Los metarrelatos se podrían entender como narrativas que buscan explicar la totalidad del mundo y sus fenómenos. ","kind":"paragraph"},{"html":"Para ver por qué hay quien sitúa a Nietzsche como posmoderno, tenemos que remitirnos a su obra <em>Sobre verdad y mentira en sentido </em><em>extramoral</em> (2012) donde afirmaba esto sobre la verdad: ","text":"Para ver por qué hay quien sitúa a Nietzsche como posmoderno, tenemos que remitirnos a su obra Sobre verdad y mentira en sentido extramoral (2012) donde afirmaba esto sobre la verdad: ","kind":"paragraph"},{"html":"¿Qué es entonces la verdad? Una hueste en movimiento de metáforas, metonimias, antropomorfismos, en resumidas cuentas, una suma de relaciones humanas que han sido realzadas, extrapoladas y adornadas poética y retóricamente y que, después de un prolongado uso, un pueblo considera firmes, canónicas y vinculantes; las verdades son ilusiones de las que se ha olvidado que lo son; metáforas que se han vuelto gastadas y sin fuerza sensible, monedas que han perdido su troquelado y no son ahora ya consideradas como monedas, sino como metal (pág 28). ","text":"¿Qué es entonces la verdad? Una hueste en movimiento de metáforas, metonimias, antropomorfismos, en resumidas cuentas, una suma de relaciones humanas que han sido realzadas, extrapoladas y adornadas poética y retóricamente y que, después de un prolongado uso, un pueblo considera firmes, canónicas y vinculantes; las verdades son ilusiones de las que se ha olvidado que lo son; metáforas que se han vuelto gastadas y sin fuerza sensible, monedas que han perdido su troquelado y no son ahora ya consideradas como monedas, sino como metal (pág 28). ","kind":"quote"},{"html":"Más adelante afirma que: ","text":"Más adelante afirma que: ","kind":"paragraph"},{"html":"Si alguien esconde una cosa detrás de un matorral, a continuación la busca en ese mismo sitio y, además, la encuentra, no hay mucho de qué vanagloriarse en esa búsqueda y ese descubrimiento; sin embargo, esto es lo que sucede con la búsqueda y descubrimiento de la «verdad» dentro del recinto de la razón. […] El que busca tales verdades en el fondo solamente busca la metamorfosis del mundo en los hombres (pág 30). ","text":"Si alguien esconde una cosa detrás de un matorral, a continuación la busca en ese mismo sitio y, además, la encuentra, no hay mucho de qué vanagloriarse en esa búsqueda y ese descubrimiento; sin embargo, esto es lo que sucede con la búsqueda y descubrimiento de la «verdad» dentro del recinto de la razón. […] El que busca tales verdades en el fondo solamente busca la metamorfosis del mundo en los hombres (pág 30). ","kind":"quote"},{"html":"Esto último, en palabras de Nietzsche, es lo que hará la ciencia (pág 32). La ciencia, como la verdad, está hecho a la medida del humano. Las verdades solo “existen” para los humanos. Así, la ciencia no descubre nada. Sobre la relación entre la ciencia y la posmodernidad y esta crisis de los relatos fundacionales y vertebradores de la cosmovisión es justamente de lo que trata Meera Nanda, microbióloga de formación y luego filósofa de la ciencia, en su libro <em>Prophets</em><em> </em><em>Facing</em><em> </em><em>Backward</em><em>. </em><em>Postmodern</em><em> Critiques </em><em>of</em><em> </em><em>Science</em><em> and </em><em>Hindu</em><em> </em><em>Nationalism</em><em> in </em><em>India</em> (2003). ","text":"Esto último, en palabras de Nietzsche, es lo que hará la ciencia (pág 32). La ciencia, como la verdad, está hecho a la medida del humano. Las verdades solo “existen” para los humanos. Así, la ciencia no descubre nada. Sobre la relación entre la ciencia y la posmodernidad y esta crisis de los relatos fundacionales y vertebradores de la cosmovisión es justamente de lo que trata Meera Nanda, microbióloga de formación y luego filósofa de la ciencia, en su libro Prophets Facing Backward. Postmodern Critiques of Science and Hindu Nationalism in India (2003). ","kind":"paragraph"},{"html":"Conectando a la autora con el planteamiento de Oyěwùmí sobre el pasado precolonial yorùbá. Nanda advierte de la idealización del pasado. Mientras que Oyěwùmí, en cierta forma, idealiza ese pasado como carente de marcas de género y achaca al colonialismo y a la occidentalización/Ilustración el abandono de esa cosmovisión. Nanda, lo que se pregunta en su libro es si ese pasado fue realmente como se describe y si la occidentalización es tan negativa como los intelectuales del denominado “Tercer Mundo” apuntan. Centrada en el nacionalismo hindú y la ciencia, no obstante su crítica también se podría aplicar a Oyěwùmí en sintonía con la crítica de Segato (2003) desarrollada en esa sección.","text":"Conectando a la autora con el planteamiento de Oyěwùmí sobre el pasado precolonial yorùbá. Nanda advierte de la idealización del pasado. Mientras que Oyěwùmí, en cierta forma, idealiza ese pasado como carente de marcas de género y achaca al colonialismo y a la occidentalización/Ilustración el abandono de esa cosmovisión. Nanda, lo que se pregunta en su libro es si ese pasado fue realmente como se describe y si la occidentalización es tan negativa como los intelectuales del denominado “Tercer Mundo” apuntan. Centrada en el nacionalismo hindú y la ciencia, no obstante su crítica también se podría aplicar a Oyěwùmí en sintonía con la crítica de Segato (2003) desarrollada en esa sección.","kind":"paragraph"},{"html":"El objetivo de Nanda es criticar la desacreditación de la ciencia por parte de las corrientes posmodernas actuales. En pocas palabras: ","text":"El objetivo de Nanda es criticar la desacreditación de la ciencia por parte de las corrientes posmodernas actuales. En pocas palabras: ","kind":"paragraph"},{"html":"La Ilustración era vista como el agente del colonialismo, y la ciencia moderna como un discurso del patriarcado y otros intereses occidentales dominantes. La salvación residía en desenmascarar las pretensiones universalistas de la ciencia y fomentar formas alternativas de conocimiento que pusieran fin a la arrogancia de Occidente. Alguien como yo solo podía ser objeto de lástima —y a menudo lo era— por ser una “mente colonizada”, deslumbrada por los encantos superficiales de Occidente (pág xii). ","text":"La Ilustración era vista como el agente del colonialismo, y la ciencia moderna como un discurso del patriarcado y otros intereses occidentales dominantes. La salvación residía en desenmascarar las pretensiones universalistas de la ciencia y fomentar formas alternativas de conocimiento que pusieran fin a la arrogancia de Occidente. Alguien como yo solo podía ser objeto de lástima —y a menudo lo era— por ser una “mente colonizada”, deslumbrada por los encantos superficiales de Occidente (pág xii). ","kind":"quote"},{"html":"En el libro advierte que los posmodernos se han aliado con los nacionalistas hindúes de derecha. Siendo la crítica a la ciencia moderna el único punto donde confluyen, los nacionalistas hindúes proponen la ciencia védica como alternativa. Valores y ciencia que, según Nanda, lo que hacen no es sino oprimir más a la población y no es ni de lejos la “descolonización de la mente” que se buscaba (pág xv). Así también si la ciencia descubre algo nuevo lo pueden siempre explicar desde la ciencia védica, lo que se ha llamado “compartimentación”. «Los indios se modernizan manteniendo primero separados lo moderno y lo tradicional, y luego aceptan lentamente las innovaciones modernas convirtiéndolas simplemente en otra forma de tradición» (pág 174). ","text":"En el libro advierte que los posmodernos se han aliado con los nacionalistas hindúes de derecha. Siendo la crítica a la ciencia moderna el único punto donde confluyen, los nacionalistas hindúes proponen la ciencia védica como alternativa. Valores y ciencia que, según Nanda, lo que hacen no es sino oprimir más a la población y no es ni de lejos la “descolonización de la mente” que se buscaba (pág xv). Así también si la ciencia descubre algo nuevo lo pueden siempre explicar desde la ciencia védica, lo que se ha llamado “compartimentación”. «Los indios se modernizan manteniendo primero separados lo moderno y lo tradicional, y luego aceptan lentamente las innovaciones modernas convirtiéndolas simplemente en otra forma de tradición» (pág 174). ","kind":"paragraph"},{"html":"Nanda, para describir la situación de India, se basa en el término acuñado por Jeffrey Herf de “modernismo reaccionario”. En palabras de Nanda citando a Herf, «El modernismo reaccionario es, sencillamente, “la adopción de la tecnología moderna por parte de quienes rechazan la razón ilustrada” (Herf 1984, 1)» (pág 7). «<em>Es la incompletitud del proyecto de la Ilustración, más que un exceso </em><em>del mismo</em><em>, lo que explica el giro de la India hacia el modernismo reaccionario</em>» (pág 43). La pregunta que se vuelve relevante sobre qué buscan los nacionalistas hindúes es: «¿Qué elementos de la herencia india buscan revivir?» (pág 17). Frente a la desacreditación de la Modernidad, Nanda nos explica cómo la concibe ella: ","text":"Nanda, para describir la situación de India, se basa en el término acuñado por Jeffrey Herf de “modernismo reaccionario”. En palabras de Nanda citando a Herf, «El modernismo reaccionario es, sencillamente, “la adopción de la tecnología moderna por parte de quienes rechazan la razón ilustrada” (Herf 1984, 1)» (pág 7). «Es la incompletitud del proyecto de la Ilustración, más que un exceso del mismo, lo que explica el giro de la India hacia el modernismo reaccionario» (pág 43). La pregunta que se vuelve relevante sobre qué buscan los nacionalistas hindúes es: «¿Qué elementos de la herencia india buscan revivir?» (pág 17). Frente a la desacreditación de la Modernidad, Nanda nos explica cómo la concibe ella: ","kind":"paragraph"},{"html":"La Modernidad, según la entiendo, es sinónimo del humanismo de la Ilustración. La “Ilustración” en sentido genérico es un espíritu, una actitud de cuestionamiento de los dogmas heredados, resumida por Kant en su famoso lema, <em>sapere </em><em>aude</em>— “atrévete a saber”, asume el riesgo del descubrimiento, ejerce el derecho a la crítica sin restricciones y acepta la soledad de la autonomía (pág 18). ","text":"La Modernidad, según la entiendo, es sinónimo del humanismo de la Ilustración. La “Ilustración” en sentido genérico es un espíritu, una actitud de cuestionamiento de los dogmas heredados, resumida por Kant en su famoso lema, sapere aude— “atrévete a saber”, asume el riesgo del descubrimiento, ejerce el derecho a la crítica sin restricciones y acepta la soledad de la autonomía (pág 18). ","kind":"quote"},{"html":"Otra cuestión que señala Nanda, es que esta crítica, que en Occidente puede servir como corrección a la fe ciega en la razón, en India, al no haber habido una secularización efectiva de la sociedad y sus instituciones, sirve como freno al proyecto de la Ilustración (pág 28). Este rechazo a la Ilustración y la demanda por una ciencia que provenga de los conocimientos ancestrales no viene, tal como se podría pensar en un primer momento, de las personas que habitan los márgenes en India, ni de los pobres, sino de las clases acomodadas (pág 31). Pero tal como afirma la autora, «la secularización nunca ha significado la muerte de Dios. Es una exigencia para que Dios abandone aquellos ámbitos de la vida —la naturaleza y la política, por ejemplo— donde no tiene cabida. La secularización consiste en delimitar, pero no en eliminar, el ámbito de Dios» (pág 267).","text":"Otra cuestión que señala Nanda, es que esta crítica, que en Occidente puede servir como corrección a la fe ciega en la razón, en India, al no haber habido una secularización efectiva de la sociedad y sus instituciones, sirve como freno al proyecto de la Ilustración (pág 28). Este rechazo a la Ilustración y la demanda por una ciencia que provenga de los conocimientos ancestrales no viene, tal como se podría pensar en un primer momento, de las personas que habitan los márgenes en India, ni de los pobres, sino de las clases acomodadas (pág 31). Pero tal como afirma la autora, «la secularización nunca ha significado la muerte de Dios. Es una exigencia para que Dios abandone aquellos ámbitos de la vida —la naturaleza y la política, por ejemplo— donde no tiene cabida. La secularización consiste en delimitar, pero no en eliminar, el ámbito de Dios» (pág 267).","kind":"paragraph"},{"html":"Frente a la ciencia moderna “occidental”, los nacionalistas hindúes presentan la ciencia védica como una solución holista, que elimina la distinción entre sujeto y objeto, y defienden está conectado con los saberes ancestrales (pág 68). Por ejemplo, dentro de la ciencia védica se encuentra el yoga, práctica que se ha extendido por Occidente. «<em>El verdadero problema es que los nacionalistas hindúes afirman encontrar tradición científica en elementos equivocados de la tradición hindú</em>» (pág 77). ","text":"Frente a la ciencia moderna “occidental”, los nacionalistas hindúes presentan la ciencia védica como una solución holista, que elimina la distinción entre sujeto y objeto, y defienden está conectado con los saberes ancestrales (pág 68). Por ejemplo, dentro de la ciencia védica se encuentra el yoga, práctica que se ha extendido por Occidente. «El verdadero problema es que los nacionalistas hindúes afirman encontrar tradición científica en elementos equivocados de la tradición hindú» (pág 77). ","kind":"paragraph"},{"html":"Otro concepto clave en la obra de Nanda es el de “caridad epistémica”. En palabras de la autora: ","text":"Otro concepto clave en la obra de Nanda es el de “caridad epistémica”. En palabras de la autora: ","kind":"paragraph"},{"html":"Esta actitud de caridad y apertura mental hacia todas las formas de conocer la naturaleza es lo que denomino caridad epistémica. Utilizo la palabra “caridad” deliberadamente, pues quiero transmitir las connotaciones de condescendencia e indulgencia hacia el otro. Sin embargo, quienes defienden la igualdad de todas las formas de conocimiento tienen motivos nobles. Desean celebrar la diversidad de las culturas no occidentales, no masculinas, no modernas y no capitalistas de todo el mundo. La fascinación por las distintas ciencias se alimenta de la creencia de que la recuperación de estas formas alternativas de comprender el mundo permitirá a la ciencia moderna recuperar valores más humanos, pacíficos y ecológicos, supuestamente ejemplificados por las mujeres y las culturas no occidentales y no modernas (pág 126). ","text":"Esta actitud de caridad y apertura mental hacia todas las formas de conocer la naturaleza es lo que denomino caridad epistémica. Utilizo la palabra “caridad” deliberadamente, pues quiero transmitir las connotaciones de condescendencia e indulgencia hacia el otro. Sin embargo, quienes defienden la igualdad de todas las formas de conocimiento tienen motivos nobles. Desean celebrar la diversidad de las culturas no occidentales, no masculinas, no modernas y no capitalistas de todo el mundo. La fascinación por las distintas ciencias se alimenta de la creencia de que la recuperación de estas formas alternativas de comprender el mundo permitirá a la ciencia moderna recuperar valores más humanos, pacíficos y ecológicos, supuestamente ejemplificados por las mujeres y las culturas no occidentales y no modernas (pág 126). ","kind":"quote"},{"html":"Pero lo que se esconde debajo de este noble afán es el abandono de la pretensión de que depuren sus creencias de elementos irracionales que puedan ser dañinos (véase por ejemplo la figura del intocable o más conocido como paria en la sociedad de castas india) (pág 127). La conclusión llevada al extremo es lo que afirma Nanda a través de las palabras de Feyerabend, «que “si los contribuyentes de California quieren que sus universidades estatales enseñen vudú, medicina popular, astrología, danzas de la lluvia, entonces esto es lo que las universidades tendrán que enseñar”» (1978, 87 [Feyeranbend citado dentro de Nanda (2003]). Aún así, críticos fervientes de la ciencia como Bruno Latour o Donna Haraway «niegan estar defendiendo un holismo premoderno que justifique una sociedad de organistas. Son conscientes de los peligros de un todo indiferenciado y quieren distanciarse de ese tipo de pensamiento» (pág 141). Desde esta perspectiva se puede llegar a afirmar lo siguiente sobre lo que la autora denomina “Tercermundismo”: ","text":"Pero lo que se esconde debajo de este noble afán es el abandono de la pretensión de que depuren sus creencias de elementos irracionales que puedan ser dañinos (véase por ejemplo la figura del intocable o más conocido como paria en la sociedad de castas india) (pág 127). La conclusión llevada al extremo es lo que afirma Nanda a través de las palabras de Feyerabend, «que “si los contribuyentes de California quieren que sus universidades estatales enseñen vudú, medicina popular, astrología, danzas de la lluvia, entonces esto es lo que las universidades tendrán que enseñar”» (1978, 87 [Feyeranbend citado dentro de Nanda (2003]). Aún así, críticos fervientes de la ciencia como Bruno Latour o Donna Haraway «niegan estar defendiendo un holismo premoderno que justifique una sociedad de organistas. Son conscientes de los peligros de un todo indiferenciado y quieren distanciarse de ese tipo de pensamiento» (pág 141). Desde esta perspectiva se puede llegar a afirmar lo siguiente sobre lo que la autora denomina “Tercermundismo”: ","kind":"paragraph"},{"html":"El argumento habitual es que las mujeres de sociedades tradicionales, no occidentales, son más “epistemológicamente privilegiadas”, ya que sus vínculos con la familia y la naturaleza aún no han sido rotos por la modernidad. Las mujeres del Tercer Mundo son las posmodernas originales, las primeras cíborgs; a diferencia de los científicos occidentales/occidentalizados que abstraen y objetivan la naturaleza, ellas experimentan las fuerzas de la naturaleza como un continuo con sus propias experiencias cotidianas en la producción y el sustento de la vida. La abstracción es masculina, opresiva y occidental, mientras que la interacción es femenina, liberadora y oriental (pág 148). ","text":"El argumento habitual es que las mujeres de sociedades tradicionales, no occidentales, son más “epistemológicamente privilegiadas”, ya que sus vínculos con la familia y la naturaleza aún no han sido rotos por la modernidad. Las mujeres del Tercer Mundo son las posmodernas originales, las primeras cíborgs; a diferencia de los científicos occidentales/occidentalizados que abstraen y objetivan la naturaleza, ellas experimentan las fuerzas de la naturaleza como un continuo con sus propias experiencias cotidianas en la producción y el sustento de la vida. La abstracción es masculina, opresiva y occidental, mientras que la interacción es femenina, liberadora y oriental (pág 148). ","kind":"quote"},{"html":"La pregunta que emerge aquí es: «¿Cómo han sido las vidas de hombres y mujeres reales en sociedades regidas por epistemologías y cosmovisiones holísticas?» (pág 158). El problema vuelve a ser que lo que desde Occidente se ve como saberes marginalizados, en esos países o culturas son hegemónicos (pág 155). La autora, hacia el final de esta sección, advierte que su afán en denunciar este movimiento de unión entre fundamentalistas religiosos y posmodernos se basa en que las «ideas tienen consecuencias» (pág 159). ","text":"La pregunta que emerge aquí es: «¿Cómo han sido las vidas de hombres y mujeres reales en sociedades regidas por epistemologías y cosmovisiones holísticas?» (pág 158). El problema vuelve a ser que lo que desde Occidente se ve como saberes marginalizados, en esos países o culturas son hegemónicos (pág 155). La autora, hacia el final de esta sección, advierte que su afán en denunciar este movimiento de unión entre fundamentalistas religiosos y posmodernos se basa en que las «ideas tienen consecuencias» (pág 159). ","kind":"paragraph"},{"html":"Volviendo a la idea de “Tercemundismo”, esta idea forma parte del núcleo del ecofeminismo. Autoras como Vandana Shiva afirman que las mujeres tienen una relación especial con la naturaleza. Claman porque la persona y la naturaleza son una «dualidad en unidad» Sin embargo, Nanda advierte que «Cualquier persona con experiencia viviendo en la India puede dar fe de que la vida social en este país dista mucho de ser una “dualidad dialéctica en la unidad”. Si la naturaleza se considerara, en efecto, un complemento inseparable de la vida humana, ¿por qué quienes trabajan con ella —cultivando la tierra, gestionando desechos humanos y animales, entrando en contacto con cuerpos— son vistos como personas contaminadas e intocables?» (pág 228-229). ","text":"Volviendo a la idea de “Tercemundismo”, esta idea forma parte del núcleo del ecofeminismo. Autoras como Vandana Shiva afirman que las mujeres tienen una relación especial con la naturaleza. Claman porque la persona y la naturaleza son una «dualidad en unidad» Sin embargo, Nanda advierte que «Cualquier persona con experiencia viviendo en la India puede dar fe de que la vida social en este país dista mucho de ser una “dualidad dialéctica en la unidad”. Si la naturaleza se considerara, en efecto, un complemento inseparable de la vida humana, ¿por qué quienes trabajan con ella —cultivando la tierra, gestionando desechos humanos y animales, entrando en contacto con cuerpos— son vistos como personas contaminadas e intocables?» (pág 228-229). ","kind":"paragraph"},{"html":"Como conclusión me gustaría volver al título del libro, “Profetas mirando hacia atrás”. ¿Qué significa? Significa el mirar hacia atrás, idealizando el pasado como solución a los problemas del presente. Los profetas serían los que anunciasen y guiasen a las personas para que volviésemos a ese pasado ideal. Pero justamente ese pasado ideal no existe.   ","text":"Como conclusión me gustaría volver al título del libro, “Profetas mirando hacia atrás”. ¿Qué significa? Significa el mirar hacia atrás, idealizando el pasado como solución a los problemas del presente. Los profetas serían los que anunciasen y guiasen a las personas para que volviésemos a ese pasado ideal. Pero justamente ese pasado ideal no existe.   ","kind":"paragraph"}],"bibliography":[{"html":"Feyerabend, P. (1978). <em>Science</em><em> in a free </em><em>society</em>. Verso.","text":"Feyerabend, P. (1978). Science in a free society. Verso."},{"html":"Herf, J. (1984). <em>Reactionary</em><em> </em><em>modernism</em><em>: </em><em>Technology</em><em>, culture and </em><em>politics</em><em> in Weimar and </em><em>the</em><em> Third Reich</em>. Cambridge University Press.","text":"Herf, J. (1984). Reactionary modernism: Technology, culture and politics in Weimar and the Third Reich. Cambridge University Press."},{"html":"Lyotard, J.-F. (2000). <em>La condición postmoderna: Informe sobre el saber</em> (M. Antolín Rato, Trad.; 7.ª ed.). Cátedra.","text":"Lyotard, J.-F. (2000). La condición postmoderna: Informe sobre el saber (M. Antolín Rato, Trad.; 7.ª ed.). Cátedra."},{"html":"Nanda, M. (2003). <em>Prophets</em><em> </em><em>facing</em><em> </em><em>backward</em><em>: </em><em>Postmodern</em><em> critiques </em><em>of</em><em> </em><em>science</em><em> and </em><em>Hindu</em><em> </em><em>nationalism</em><em> in </em><em>India</em>. Rutgers University Press.","text":"Nanda, M. (2003). Prophets facing backward: Postmodern critiques of science and Hindu nationalism in India. Rutgers University Press."},{"html":"Nietzsche, F. (2012). <em>Sobre verdad y mentira en sentido </em><em>extramoral</em><em> y otros fragmentos de filosofía del conocimiento</em> (M. Garrido, Ed.; 2.ª ed.). Tecnos.","text":"Nietzsche, F. (2012). Sobre verdad y mentira en sentido extramoral y otros fragmentos de filosofía del conocimiento (M. Garrido, Ed.; 2.ª ed.). Tecnos."},{"html":"Segato, R. (2003). Género, política e hibridismo en la transnacionalización de la cultura Yoruba. <em>Estudos Afro-Asiáticos, 25</em>(2), 333–363.","text":"Segato, R. (2003). Género, política e hibridismo en la transnacionalización de la cultura Yoruba. Estudos Afro-Asiáticos, 25(2), 333–363."}]}];
const CATALAN={"valencia":["Un crim va commocionar l’Argentina recentment: tres noies, Brenda Loreley del Castillo (20 anys), Morena Verdi (20 anys) i Lara Morena Gutiérrez (15 anys), van desaparèixer el 19 de setembre de 2025 a Buenos Aires. Els seus cossos van ser trobats cinc dies després, enterrats en un pou, i presentaven signes de tortura i mutilacions. Feien treball sexual i se’ls van oferir 300 dòlars a cadascuna per mantenir relacions sexuals. Van quedar que les recollirien el divendres 19 de setembre i, després d’això, se’n va perdre el rastre. Segons el diari Clarín, va ser «una venjança del narcotràfic planificada». Tal com diu la font, «la principal hipòtesi la va introduir de manera informal un dels primers detinguts en la causa que, segons va relatar a la policia, una de les víctimes “s’hauria quedat” amb una quantitat d’entre 60 i 70 mil dòlars o quatre quilos de cocaïna». La tortura i l’assassinat es van retransmetre per una plataforma a un grup reduït d’entre 40 i 45 persones. «“Això els passa als qui em roben”, hauria estat el missatge que volia donar l’autor intel·lectual del triple crim de Brenda, Morena i Lara».","Valencia, en la seva obra <em>Capitalismo Gore</em> (2010), reflexiona precisament sobre aquest tipus de casos. Fa una anàlisi aguda del capitalisme en el context de Mèxic, concretament a Tijuana, que és a la frontera amb els EUA, i ens proporciona un concepte clau per analitzar l’estadi del capitalisme que estem vivint. Ella l’anomena “capitalisme gore”, definit com la «reinterpretació donada a l’economia hegemònica i global en els espais (geogràficament) fronterers» (pàg. 15). Seria com una mena de colonització econòmica, ja que es dona, segons les seves paraules, «en els intersticis del capitalisme [on] ningú no té res a perdre, perquè la vida (l’últim dels grans tabús) ja no és important» (pàg. 21). Encara que centri la seva anàlisi en el Tercer Món, cal evitar interpretar-ho","«com una desestructuració que ens mostra les fallades en l’aplicació del sistema, ja que […] [és] un panorama de la sort en què es desenvoluparà el Primer Món futur, ateses les lògiques globals del capitalisme, només que reflectit en el Tercer Món d’una manera accelerada i hiperpresent que ha esdevingut gore» (pàg. 194-195).","Valencia examina en la seva obra <em>Capitalismo Gore</em> els càrtels de la droga i la violència que exerceixen. Relaciona la seva existència amb la precarització de l’economia i la cerca de diners ràpids (pàg. 36 i 41). Anomena les persones que s’hi dediquen “subjectes endriags”, és a dir, «emprenedors del capitalisme gore» (pàg. 46). La «sobreespecialització de la violència [es converteix] no només en una feina normal sinó en una feina desitjable en oferir “oportunitats de superació” davant la precarització global del treball» (pàg. 47). Això és causat per «les exigències de l’ordre econòmic actual [que] condueixen a la creació d’un ordre subjacent que fa de la violència una arma de producció i la globalitza» (pàg. 53). Aquesta violència, en paraules de l’autora, és «un postcolonialisme in extremis […] recolonitzat a través de l’hiperconsumisme i la frustració» (pàg. 56).","En Sayak Valencia es creuen dues autores del projecte, a saber, Oyèrónkẹ Oyěwùmí i Suely Rolnik, ja que la primera va exposar les conseqüències que va portar la colonització a la població yorùbá, mentre que Valencia analitza el neocolonialisme i la colonització econòmica de Mèxic i els seus efectes devastadors. D’altra banda, també es poden apreciar ressonàncies amb el plantejament de Rolnik, ja que, al cap i a la fi, el subjecte endriag és el segrest de la força vital de què ens parlava l’autora brasilera.","Aquest subjecte endriag és convertit en heroi, se’l lloa i fins i tot s’escriuen cançons sobre ell (com els narcocorridos). És el subjecte que ha «ascendit socialment» mitjançant el consumisme (pàg. 71). La majoria són homes que, en defensa de la seva masculinitat i del seu paper com a proveïdors i davant la precarietat econòmica, es decanten per aquest camí (pàg. 90 i 91). Alguns els veuen amb simpatia, ja que de vegades compleixen la funció de l’Estat (pàg. 72). El gir ètic que s’ha produït, en paraules de l’autora, és que «l’imperatiu categòric ha estat desplaçat per l’imperatiu econòmic» (pàg. 78). Tal com diu l’autora:","Ja no existeixen els codis d’honor o de respecte envers les dones i els infants; ara els únics codis que cal seguir estan dictats per l’economia, que imposa assassinar sense cap distinció de gènere o edat, si aquest fet incrementa els seus guanys o la seva competitivitat en el mercat criminal (pàg. 106).","Això desemboca en el «necropoder», és a dir, «l’apropiació i aplicació de les tecnologies governamentals de la biopolítica per subjugar els cossos i les poblacions, que integra com a element fonamental la sobreespecialització de la violència i té com a finalitat comerciar amb el procés de donar mort» (pàg. 147). Cal remarcar que, encara que els subjectes endriags s’oposen a l’Estat i són una conseqüència del neoliberalisme en països precaritzats pel sistema econòmic, no són en absolut herois ni subjectes revolucionaris, sinó simplement «un empresari que aplica i sintetitza literalment les lògiques i les demandes neoliberals més aberrants» (pàg. 145).","Aquest necropoder és el que explica, en última instància, el fet d’haver matat les tres noies amb tanta crueltat. No es tracta només d’un assassinat, sinó d’una pràctica de governança a través de la violència. La retransmissió del crim a un grup reduït d’espectadors mostra com la violència no només s’exerceix, sinó que es consumeix i es distribueix, convertint-se en un producte dins del mercat criminal. En aquest sentit, la sobreespecialització de la violència de què parla Valencia es fa evident tant en les mutilacions com en la posada en escena del càstig. És, així, una «lliçó»: si em traeixes (suposadament una d’elles li va robar diners), jo donaré una lliçó a tu i a la resta. Aquesta violència no és arbitrària, sinó exemplar i comunicativa: produeix terror. Es tracta de posicionar-se en el poder i de fer recordar qui mana, exercint una forma de sobirania que no passa per l’Estat, sinó per la capacitat de donar mort, és a dir, pel necropoder.","Aquí la precarització econòmica és central i opera en totes dues direccions. D’una banda, les tres noies feien treball sexual per poder tirar endavant les seves famílies; en el cas de Lara, de només 15 anys, cal parlar més aviat d’explotació sexual. De l’altra, els narcotraficants entenen la violència com una forma de producció i acumulació de capital, una via d’accés ràpid a recursos i estatus dins del marc del capitalisme gore.","A més, aquest exercici de la violència està profundament travessat per la masculinitat. Tal com assenyala Valencia, molts d’aquests subjectes endriags són homes que, davant la precarietat, busquen reafirmar el seu rol de proveïdors i la seva posició de poder mitjançant la violència (pàg. 90-91). En aquest cas, el control, la tortura i l’exhibició dels cossos femenins també es poden llegir com una forma extrema de dominació masculina, en què el cos de les dones es converteix en l’espai on s’inscriu aquest poder."],"rolnik":["Horkheimer i Adorno, en el seu llibre <em>Dialéctica de la Ilustración</em> (1998), parlen de com en la indústria cultural s’han eliminat les diferències. «Sempre es pot captar immediatament en una pel·lícula com acabarà, qui serà recompensat, castigat o oblidat» (pàg. 170). Els productes culturals que tenim, segons la seva opinió, no estan fets perquè pensem, sinó perquè consumim. Perquè siguem subjectes passius (pàg. 171). Aquesta indústria encarna el paradigma neoliberal. «L’amo ja no diu: “Penseu com jo o morireu”. Diu: “Sou lliures de pensar com jo […]”». Tota la indústria cultural s’adreça específicament a la classe obrera. S’infiltra com a ideologia (pàg. 178). Així, Horkheimer i Adorno afirmen que","«la indústria cultural continua sent la indústria de la diversió. […] La diversió és la prolongació del treball sota el capitalisme tardà. La busca qui vol sostreure’s al procés de treball mecanitzat per poder tornar a estar a la seva altura, en condicions d’afrontar-lo» (pàg. 181).","Aquesta indústria és totalment prescindible segons els autors (pàg. 183). «En l’època de l’expansió liberal, la diversió vivia de la fe en el futur: tot continuaria així i, tanmateix, aniria a millor. Avui la fe torna a espiritualitzar-se; es fa tan subtil que perd de vista qualsevol meta i queda reduïda al fons daurat que es projecta darrere del que és real» (pàg. 188).","Aquesta qüestió de com ens han colonitzat la ment (o l’inconscient) és la que planteja Suely Rolnik en el seu llibre titulat <em>Esferas de la insurrección. Apuntes para descolonizar el inconsciente</em> (2019). Rolnik, seguidora de Deleuze i Guattari, ens proposa en la seva obra una sèrie de reflexions i eines per resoldre aquesta qüestió. La tesi és que el capitalisme s’està apropiant de la potència creadora, de la força vital de creació, canalitzant-la. Així, «la resistència actualment passaria per un esforç de reapropiació col·lectiva d’aquesta potència» (pàg. 28). Rolnik proposa «designar com a “inconscient colonial-capitalístic” la política de l’inconscient dominant en aquest règim» (pàg. 31).","Rolnik, per exemplificar dues maneres de crear, es basa en l’exposició <em>Caminhando</em> de Lygia Clark. S’ofereix una cinta de Möbius, unes «tires de paper, tisores i cola d’enganxar, juntament amb unes instruccions d’ús breus i senzilles, amb una sola advertència: cada vegada que trobin un punt triat anteriorment per perforar la superfície, l’han d’evitar per continuar retallant» (pàg. 37). Així se segueix fins que ja no es pugui tallar més longitudinalment. «En cas que no seguim les instruccions de l’artista i insistim a tornar a tallar a partir d’un punt ja perforat, el resultat és la reproducció infinita de la seva forma inicial» (pàg. 41). Si seguim les instruccions de Clark, s’aplica la potència creadora, la pulsió vital, mentre que, si ignorem aquestes recomanacions, es produeix la reproducció del mateix. És el que Deleuze i Guattari van diferenciar entre repetició nua («repetició del Mateix» (pàg. 45)) i repetició vestida, és a dir, «la repetició extraordinària o singular» (pàg. 331). Seguint l’autora brasilera, tindríem dos moviments: «el moviment que pressiona la subjectivitat en direcció a “la conservació de les formes en què la vida es troba materialitzada” i, de l’altra banda, el moviment que la pressiona en direcció “a la conservació de la vida en la seva potència de germinació”» (pàg. 49).","Tornant al tema de l’art, el règim colonial-proxenetístic busca apropiar-se de la força creadora de l’art, colonitzar-lo perquè talli pel mateix costat i no per un altre. Té dos objectius: d’una banda, «neutralitzar la força transfiguradora de les pràctiques artístiques»; de l’altra, «valer-se de l’art com a passaport d’admissió als salons internacionals de les elits del capitalisme financeritzat» (pàg. 83). Rolnik destaca la importància de lluitar en l’esfera micropolítica (inconscient, afectes, forces, etc.) i no només en la macropolítica (política estatal, democràcia representativa, institucions, etc.).","Connectant amb el plantejament de Sayak Valencia, Rolnik ens avisa que:","Res no garanteix que tots els subalterns siguin, per principi, agents potencials de la insubordinació micropolítica, ja que la seva subjectivitat pot estar sota l’encís de l’inconscient propi del règim dominant, encara que el combatin macropolíticament (pàg. 118).","El capital, de fet, colonitza les seves ments perquè, com hem vist abans, redirigeixin la seva energia vital cap a la reproducció d’aquest. Com he plantejat en l’exposició de Valencia, davant l’auge consumista i el desig de formar-ne part, el que crea en zones precaritzades és el sorgiment del subjecte endriag. Un subjecte que, lluny de ser insubordinat, encarna el mandat capitalista i la masculinitat (si es poden concebre com a separats).","L’objectiu és assolir «en cada situació un llindar que permeti que la força vital creadora s’alliberi, almenys prou, del seu proxenetisme» (pàg. 129). Així, la descolonització de l’inconscient és una tasca que no té fi, és un procés continu i no un objectiu. En paraules de Rolnik:","Desitjar aquest esdeveniment d’una vida no explotada pel proxenetisme és l’antídot per a la patologia del règim colonial-capitalístic, que ens fa desitjar el gaudi del poder —un gaudi propi d’una subjectivitat reduïda al subjecte, que ha perdut la connexió amb la vida i la ceguesa de la qual ens porta a un miserable narcisisme devastador— (pàg. 132).","Finalment, reprodueixo aquí els deu suggeriments que fa Rolnik per descolonitzar l’inconscient:","1. Desanestesiar la nostra vulnerabilitat a les forces en els seus diagrames variables, potència de la subjectivitat en la seva experiència fora-del-subjecte.","2. Activar el saber ecoetològic i expandir-lo al llarg de la nostra existència: l’experiència del món en la seva condició de vivent, les forces del qual produeixen efectes en el nostre cos, que pertany a aquesta mateixa condició i la comparteix amb tots els elements que componen el cos viu de la biosfera.","3. Desobstruir cada vegada més l’accés a la tensa experiència de l’estrany-familiar.","4. No denegar la fragilitat resultant de la desterritorialització desestabilitzadora que l’estat estrany-familiar promou inevitablement.","5. No interpretar la fragilitat d’aquest estat inestable i la seva incomoditat com “una cosa dolenta”, ni projectar sobre aquest malestar lectures fantasmàtiques (ejaculacions precoces de l’ego, provocades per la seva por al desemparament i a la fallida i les seves conseqüències imaginàries: el repudi, el rebuig, l’exclusió social, la humiliació, la bogeria). Aquestes projeccions són portadores de falses explicacions de la causa del malestar, les quals sempre l’associen a un suposat error i, per tant, a la culpa, sigui la nostra o la de qualsevol altre.","6. No cedir a la voluntat de conservació de les formes d’existència i a la pressió que aquesta exerceix contra la voluntat de potència de la vida en el seu impuls de producció de diferència. Al contrari, buscar sostenir-se en el fil tènue d’aquest estat inestable fins que la imaginació creadora construeixi una manera de cos-i-parla que, en ser portadora de la pulsió de l’estrany-familiar, sigui capaç d’actualitzar el món virtual que aquesta experiència anuncia, permetent així que les formes agòniques acabin de morir-se.","7. No atropellar el temps propi de la imaginació creadora, per evitar el risc d’interrompre la germinació d’un món. Aquesta interrupció torna la imaginació vulnerable a l’expropiació pel règim colonial-proxenetístic que la desvia del seu destí ètic. És en aquest desviament que és capturada i tendeix a sotmetre’s a l’imaginari que aquest règim ens imposa seductorament, cosa que la torna totalment estèril. És que, en lloc de l’exercici de la creació del que és nou (exigit per la vida), la imaginació passa a reduir-se a l’exercici de la seva capacitat creativa (dissociada de la vida) per produir novetats, les quals multipliquen les oportunitats per a les inversions de capital i exciten la voluntat de consum a una velocitat exponencial.","8. No renunciar al desig en la seva ètica d’afirmació de la vida, cosa que implica mantenir-la tan fecunda com sigui possible a cada moment, fluint en el seu procés il·limitat de diferenciació de formes i valors.","9. No negociar l’innegociable: tot allò que obstaculitza l’afirmació de la vida, en la seva essència de potència de creació. Aprendre a distingir-ho del negociable: tot allò que es podria acceptar i reajustar perquè no debilita la força vital instituent sinó que, al contrari, genera les condicions objectives perquè es produeixi un esdeveniment, complint-se així el seu destí ètic.","10. Practicar el pensament en la seva plena funció: indissociablement ètica, estètica, política, crítica i clínica. És a dir, reimaginar el món en cada gest, paraula, relació amb l’altre (humà i no humà), manera d’existir —sempre que la vida així ho exigeixi— (pàg. 175-177)."],"oyewumi":["Per endinsar-nos en la complexitat de la dona com a concepte, podem acudir a diversos llocs. Per exemple, a la psicoanàlisi, començant amb Freud i el seu discurs sobre la feminitat fins a arribar a Lacan. Aquest últim, en el <em>Seminari 20: Encara</em>, tracta la qüestió de la dona o, més ben dit, de la posició femenina. En aquest seminari ens diu que:","La dona només [sic] es pot escriure ratllant La. No hi ha La dona, article definit per designar l’universal. No hi ha La dona, ja que —abans ja em vaig permetre el terme, per què tenir escrúpols ara— per essència ella no tota és (Lacan, 2008, p. 89).","Lacan fuig dels essencialismes. Per això hem d’entendre La dona com la posició femenina, que poden ocupar tant el sexe masculí com el femení. Per això en la psicoanàlisi lacaniana no importa realment si tens genitals masculins o femenins. El que importa, deixant de banda el dispositiu sexe-gènere, és en quina posició et col·loques. Així, es podria afirmar, tal com fa Lacan, que La dona no existeix, sinó que existeixen les dones, una a una.","La pregunta que esdevé rellevant és: existeixen les dones? Aquest tema ha estat objecte de debat a Occident des de fa diverses dècades. La qüestió va començar amb la psicoanàlisi, però va adquirir rellevància amb el naixement dels estudis queer, inaugurats per Judith Butler als anys noranta quan va desmuntar el binarisme sexe-gènere afirmant que el sexe també és construït i no només el gènere. Ser “dona” és una performance? O potser serà com deia Wittig i només seran les lesbianes les que no seran dones?","Una altra qüestió és si podem extrapolar la categoria de dona a altres cultures o societats no occidentals. Per a l’autora d’aquesta secció, Oyèrónkẹ Oyěwùmí, no podem. Autora del llibre <em>La invención de las mujeres. Una perspectiva africana sobre los discursos occidentales del género</em> (2023), ens ofereix una anàlisi de la cultura ọ̀yọ́-yorùbá precolonial, on no existien les dones com a concepte.","El tema central del llibre és desmuntar la idea d’universalitat entorn del concepte de dona. Encara que Oyěwùmí no rebutja l’existència de jerarquies en la societat ọ̀yọ́-yorùbá precolonial, afirma que «la identitat social era relacional i no essencialista» (pàg. 46). L’autora comença parlant de la persistència de l’oculocentrisme a Occident. «La raó per la qual el cos ha estat tan rellevant a Occident és que el món es percep sobretot per la vista» (pàg. 57). Així, afirma que «només es perceben com a encarnades les dones; els homes no tenen cossos —són ments ambulants» (pàg. 64).","El que afirma Oyěwùmí és que el discurs feminista global se sustenta en una pressuposició que «les idees biològiques i les socials poden separar-se i aplicar-se de manera universal» (pàg. 70). «Així, com que el gènere és una construcció social, també és un fenomen històric i cultural. Aleshores, resulta lògic suposar que en algunes societats la construcció de gènere mai no va arribar a produir-se» (pàg. 71).","L’autora nigeriana afirma que en la cultura ọ̀yọ́-yorùbá precolonial el que primava no era el dispositiu sexe-gènere, sinó el de la senioritat. La jerarquia era que els més grans manaven sobre els més joves. Així, la senioritat «és relacional i dinàmica i, a diferència del gènere, no se centra en el cos» (pàg. 78). Com que «ningú no està de manera permanent en una posició de més o menys edat; tot dependrà de qui sigui present en cada situació específica» (pàg. 126), és més dinàmica, no com en el patriarcat, en què, en néixer dona, ja es troba subordinada als homes. Això es reflecteix en el llenguatge, ja que «el llenguatge yorùbá està lliure de gènere» (pàg. 103). Tot i que és cert que sí que diferenciaven anatòmicament els mascles de les femelles en el seu idioma (fent servir obìnrin i ọkùnrin per a mascle i femella respectivament) (pàg. 114). Aquestes paraules no connotaven absolutament res més enllà de l’anatomia humana. De fet, «les obìnrin no tenien interessos col·lectius com a grup perquè no constituïen una categoria social» (pàg. 154).","També parla de la incorporació al llinatge. «Naixement per a ọkọ i matrimoni per a aya» (pàg. 130). Tot i voler reivindicar la cultura ọ̀yọ́-yorùbá precolonial com una cosa no patriarcal ni masclista, Oyěwùmí afirma que «el pagament del dot conferia accés sexual i paternitat» (pàg. 139). Encara que existís el matrimoni, Oyěwùmí declara que:","El sistema d’herència s’arrelava en la idea que només heretarien entre si els qui mantinguessin relacions consanguínies. Els principals beneficiaris i beneficiàries eren els fills i filles, les germanes i els germans de qui moria (pàg. 147).","Així, al cònjuge no li corresponia res. D’altra banda, «en la concepció yorùbá original no existeix una idea de treball basada en el gènere» (pàg. 160). Després d’exposar això, Oyěwùmí fa una declaració demolidora com aquesta: «L’exportació mundial de teoria feminista és part del procés de promoció de les normes i valors occidentals» (pàg. 181). És a dir, que en la societat yoruba precolonial no tenia sentit el feminisme, ja que les dones no eren oprimides ni subordinades pel fet de ser dones, però que després, amb el colonialisme, això va canviar i se’ls va introduir el problema i la solució, a saber, el patriarcat i el feminisme occidental.","També s’assenyala que la historiografia (majoritàriament en anglès) ha tendit a interpretar les respostes que obtenia del poble yorùbá atribuint-los gènere, per exemple, a la categoria de governant (aláàfin), tractant-los sempre en masculí. «Tant anamascles com anafemelles es reconeixen com a fundadores de llinatges i ciutats» (pàg. 201). Quan esmenta anamascles/anafemelles, Oyěwùmí es refereix al que habitualment anomenem a Occident el sexe masculí i femení.","Connectant el plantejament d’Oyěwùmí amb el de Suely, veiem que és la colonització la que va produir i, en termes deleuzians, va reterritorialitzar la manera de veure el gènere. Va ser l’inconscient colonial-capitalístic, tal com ella l’anomenava, el que es va imposar. El fet de tallar la banda de Möbius pel mateix costat. Es podria dir que es va colonitzar l’inconscient del poble yorùbá. Essencialitzant i naturalitzant les categories rígides de gènere binàries. Instituint l’opressió de les dones i el patriarcat. En paraules de l’autora, «el mateix procés que va classificar i reduir les anafemelles africanes a “dones” les va tornar no elegibles per als papers de lideratge» (pàg. 254).","En síntesi:","El sistema precolonial de senioritat havia estat desplaçat per un sistema europeu de jerarquia sexual en què les femelles sempre serien inferiors i estarien subordinades als mascles. La manifestació definitiva d’aquest nou sistema va ser un Estat colonial patriarcal que, malauradament, va sobreviure a la desaparició de l’«Imperi» (pàg. 300).","Per matisar també la posició d’Oyěwùmí, em remeto a Segato (2003), en un article seu on critica la idea que no hi hagués subordinació ni patriarcat de les dones en el poble yorùbá. Em sembla especialment rellevant la idea que, al cap i a la fi, la societat yorùbá és patrilineal, és a dir, que l’aya es trasllada a casa de l’ọkọ. L’aya és la dona i tot el seu llinatge, mentre que l’ọkọ és el marit i tot el seu llinatge (per això, per exemple, la germana del marit també seria ọkọ). Tot i així, tal com indica Segato (2003), ọkọ i aya es refereixen a «amo/de dins i no-amo/de fora», respectivament. Per tant, continua havent-hi una jerarquia entre l’ọkọ i l’aya, en què la dona està subordinada a l’home (pàg. 342). A més, els homes anatòmics no podien ser mai aya (pàg. 343). Sense parlar ja del fet que, quan el marit moria, «només els ‘anamascles’ (anamales) més joves que ell a la casa podien reclamar drets sexuals sobre ella, “en la mesura que aquest és un món heterosexual” (sic, èmfasi meu), i quan un oko anafemella (anafemale sènior) reclamava drets d’herència sobre la vídua, l’accés sexual passava a un dels seus fills anamascles (anamales)» (pàg. 342). Queda clar que, segons Segato, la societat yorùbá no és tal com Oyěwùmí la descriu."],"ueno":["Keith Jenkins, en el seu llibre <em>Repensar la historia</em> (2009), defineix la història com «un discurs, entre molts d’altres, sobre el món» (pàg. 7). Més endavant afirma que «el món o el passat ens arriba sempre en forma d’històries i que no podem sostreure’ns d’aquestes històries (narratives) per comprovar si es corresponen amb el món o el passat reals, perquè aquestes narratives “sempre donades” constitueixen la “realitat”» (pàg. 12). Precisament és «a causa únicament de la fragilitat epistemològica de la història. Perquè, si fos possible conèixer el passat d’una vegada per totes, ara i per sempre, no caldria que s’escrivissin més històries, ja que tindria sentit que els historiadors relatessin una vegada i una altra la mateixa història de la mateixa manera?» (pàg. 14).","No ens podem desplaçar cap al passat. És impossible, no ens podem teletransportar. Per això, tal com explica Meera Nanda (2003), el passat es tendeix a idealitzar, sobretot els mites sobre els països o, més ben dit, els actuals estats nació. Nanda (2003) se centra en el cas de l’Índia, però aquest plantejament es pot extrapolar. Des de teòrics com Thomas Hobbes i la seva famosa obra <em>Leviatan</em>, es formulava que, per poder coexistir en pau, hem de cedir part de la nostra autonomia a un sobirà, perquè, si no, estaríem en un estat de guerra absolut, tots contra tots: això seria l’estat de naturalesa. El que planteja Hobbes és un contracte social. Això arriba fins al punt que filòsofs que ens són més contemporanis, com Max Weber, van postular la idea que l’Estat és qui té el monopoli de la violència justificada. Una pregunta que ens pot sorgir és: qui ha signat aquest contracte social i per quant de temps s’ha signat? No sembla plausible que es pugui tornar a sotmetre a escrutini la forma de govern que desitgem. De fet, pel·lícules com <em>La Purga</em> (2013), de James DeMonaco, ens recorden què podria passar si no acceptéssim cedir l’ús de la violència a l’Estat. Aquesta saga de pel·lícules, al més fidel estil hobbesià, exemplifica l’estat de naturalesa postulat per aquest últim.","D’aquestes dues qüestions, a saber, de la història i de l’Estat nació, és del que tracta, en síntesi, Chizuko Ueno en la seva obra <em>Nationalism and Gender</em> (2004). Ueno se centra en la figura de les “dones de consol” durant la Guerra del Pacífic (1937-1945), guerra en què el Japó es va estendre colonitzant part de la Xina i Corea. En aquesta expansió van segrestar dones i les van obligar a prostituir-se amb els soldats japonesos. Hi va haver silenci sobre aquest fet fins que una supervivent coreana, Kim Hak-sun, va denunciar públicament els fets perpetrats (pàg. ix).","Ueno, com Jenkins, afirma que «la història és una cosa que sempre està subjecta a revisió per part dels qui viuen en el present» (pàg. 3). El seu objectiu no és establir una única veritat (pàg. 4). De fet, «ningú no va considerar que el sistema de dones de consol fos un delicte fins que les mateixes dones afectades es van definir com a víctimes i el van reinterpretar com un delicte sexual» (pàg. 5). Per tant, no es pot parlar de “fets absoluts” en la història. Ella distingeix tres tipus d’escola en la història: la de la discontinuïtat, la de la continuïtat i la neocontinuïtat. La primera afirma que «les estructures socials opressives caracteritzades per les pràctiques feudals i el sistema imperial van ser eliminades amb la democratització de la postguerra i que va començar una nova era» (pàg. 6). Després, l’escola de la continuïtat es basa en «la persistència del “projecte de modernització” des de l’era Meiji […] En conseqüència, des de la perspectiva d’aquesta escola de la continuïtat, els principis de la democratització de postguerra no van ser simplement una cosa imposada al Japó des de l’exterior» (pàg. 7). Finalment, la de la neocontinuïtat entén el bel·licisme i el sorgiment de l’Estat nació com una conseqüència de la modernitat i no, per tant, com una desviació del projecte. Això permet comparar el cas del Japó amb altres països (no només els de les forces de l’Eix) (pàg. 9). Ueno s’adhereix a aquesta última escola.","Ueno, seguint Anderson, afirma que «l’Estat nació, en inventar un poble homogeni, va crear una ‘comunitat imaginada’ i aquesta identitat grupal va arribar a constituir el nucli dels nostres conceptes de cultura i nació (Anderson, 1985). Encara avui continuem bregant amb les conseqüències d’aquest projecte de nacionalització» (pàg. 10). Així, «aquest llibre és un intent de generitzar [aplicar una categoria de gènere a] l’Estat nació» (pàg. 11).","Una qüestió rellevant és que, en el moment en què es reconeix l’acció de les dones en la història, ja no se les pot exonerar de la culpa dels crims. Aquesta història que no manté les dones en la posició de víctimes és la que s’anomena l’escola reflexiva d’història de les dones (pàg. 15).","Ueno, revisant la història de les pensadores japoneses de l’època, esmenta Takamure Itsue, fidel defensora del món rural i fervent enemiga de la modernització. En paraules d’Ueno, aquesta idea que sostenia Takamure de l’«‘ideal rural’ és en si mateixa una ideologia reaccionària nascuda de l’oposició a la incipient era moderna, que genera nostàlgia per un passat inexistent, un punt de vista que no és més que un subproducte de l’era moderna» (pàg. 30). Això ressona amb el que he comentat en Meera Nanda (2003), aquell advertiment sobre la idealització del passat que es criticava al plantejament d’Oyěwùmí (2023).","En la guerra, els països aliats i els de l’Eix van prendre camins diferents pel que fa al paper de les dones en la guerra. Mentre que els primers van optar per un model integracionista de gènere, mantenint les dones a la rereguarda (pàg. 50), els segons van optar per un model segregacionista de gènere, mantenint les dones a la llar cuidant els infants (pàg. 43). Davant l’estratègia dels països aliats, com els EUA i Anglaterra, l’autora es planteja: «Tanmateix, hem de considerar això com l’alliberament de la dona o com la nacionalització definitiva de la dona?» (pàg. 51).","A l’hora de jutjar la història, Ueno es pregunta sobre l’etiquetatge de les guerres com a “bones” o “dolentes”. En les seves paraules:","Si això és així, significa que les guerres poden dividir-se en guerres bones i guerres dolentes, i la culpabilitat de les dones japoneses rau en el fet que no van tenir la previsió d’adonar-se que estaven donant suport a una guerra dolenta. Quan es tracta de distingir entre guerres bones i dolentes, com es fa, si no després dels fets? (pàg. 59, èmfasi afegit).","És fàcil jutjar la història mirant enrere, però en el moment no és tan fàcil. Com sabien les dones dels països aliats que estaven donant suport a una guerra “justa”? «L’anàlisi feminista de l’Estat nació ha deixat clar que la igualtat de gènere és impossible en principi dins d’un marc de modernitat, patriarcat i Estat nació» (pàg. 63). L’Estat nació està generitzat, les dones han estat nacionalitzades. La pregunta que es formula Ueno és: podem anar més enllà? (pàg. 64).","Ueno en posa un exemple clar en citar Ehara Yumiko, que va especular sobre la visió dels homes coreans i japonesos, que veurien la violació de les dones com la violació de l’honor dels seus respectius països. Aquesta concepció parteix d’una premissa masclista segons la qual les dones pertanyen a l’Estat nació i violar-les viola també l’Estat i és també una falta de respecte envers els homes d’aquell país (pàg. 74). «Aquest atac dels soldats s’adreça sobretot a la sexualitat de les dones, perquè els agressors saben que és una demostració del seu poder, que simbolitza el màxim insult als homes del bàndol enemic. És precisament per aquesta raó que la violació desperta una fúria tan vehement en els homes del país enemic» (pàg. 80). Així també es va traçar la línia entre dones “pures” i “impures”, unes mereixedores de consol i les altres no (pàg. 89). Això és el que Ueno anomena la «metàfora de la violació», la identificació de la nació amb les dones i la transgressió envers les dones com a agressió a l’Estat nació (pàg. 94).","Tornant al tema de la història, Ueno declara que «la idea d’una ‘història oficial’ s’ha d’abandonar. Des de dins de la història és possible escriure ‘una altra història’ de les minories, els febles i els oprimits, encara que es tracti d’una sola persona» (pàg. 104). Seguint amb aquest tema, es pregunta sobre el corrent del positivisme en la història. Aquell corrent que, com que no hi ha proves documentades i desconfia dels testimonis, tendeix a desacreditar les demandes de les dones de consol, ja que hi ha pocs documents que no hagin estat destruïts i el que queda són els testimonis de les mateixes víctimes (pàg. 110).","La pregunta que, cap al final del seu llibre, esdevé rellevant és aquesta: pot el feminisme transcendir el nacionalisme? «L’objectiu del feminisme no és substituir una categoria excloent per una altra. L’objectiu no és construir una comunitat essencialista anomenada dones. Així com no puc ser reduïda a la categoria de ‘dona’, no em reduïu a la de ‘subjecte nacional’. La intenció és relativitzar aquestes categories» (pàg. 144). Cap al final d’aquest capítol expressa una frase contundent amb què tancar la qüestió de les guerres “justes” i “injustes”: «La guerra en si mateixa és el crim» (pàg. 146)."],"nanda":["L’autor o autora que es podria situar a l’inici de la contemporaneïtat en la filosofia és més que discutible. Hi ha qui situa Nietzsche en aquest inici. Habitualment, el pas de la modernitat filosòfica a la contemporaneïtat es dona pel pas a la postmodernitat. Què és la postmodernitat? En paraules de Lyotard, qui va encunyar el terme, en la seva obra <em>La condición postmoderna</em> (2000): «Simplificant al màxim, es considera “postmoderna” la incredulitat respecte dels metarelats» (pàg. 10). Els metarelats es podrien entendre com a narratives que busquen explicar la totalitat del món i els seus fenòmens.","Per veure per què hi ha qui situa Nietzsche com a postmodern, ens hem de remetre a la seva obra <em>Sobre verdad y mentira en sentido extramoral</em> (2012), on afirmava això sobre la veritat:","Què és, doncs, la veritat? Una host en moviment de metàfores, metonímies, antropomorfismes; en definitiva, una suma de relacions humanes que han estat realçades, extrapolades i adornades poèticament i retòricament i que, després d’un ús prolongat, un poble considera fermes, canòniques i vinculants; les veritats són il·lusions de les quals s’ha oblidat que ho són; metàfores que s’han tornat gastades i sense força sensible, monedes que han perdut l’encunyació i que ara ja no són considerades monedes, sinó metall (pàg. 28).","Més endavant afirma que:","Si algú amaga una cosa darrere d’un matoll, a continuació la busca en aquell mateix lloc i, a més, la troba, no hi ha gaire de què vanagloriar-se en aquella cerca i aquell descobriment; tanmateix, això és el que passa amb la cerca i el descobriment de la «veritat» dins del recinte de la raó. […] Qui busca aquestes veritats, en el fons, només busca la metamorfosi del món en els homes (pàg. 30).","Això últim, en paraules de Nietzsche, és el que farà la ciència (pàg. 32). La ciència, com la veritat, està feta a la mesura de l’ésser humà. Les veritats només “existeixen” per als humans. Així, la ciència no descobreix res. Sobre la relació entre la ciència i la postmodernitat i aquesta crisi dels relats fundacionals i vertebradors de la cosmovisió és precisament del que tracta Meera Nanda, microbiòloga de formació i després filòsofa de la ciència, en el seu llibre <em>Prophets Facing Backward. Postmodern Critiques of Science and Hindu Nationalism in India</em> (2003).","Connectant l’autora amb el plantejament d’Oyěwùmí sobre el passat precolonial yorùbá, Nanda adverteix de la idealització del passat. Mentre que Oyěwùmí, en certa manera, idealitza aquell passat com a mancat de marques de gènere i atribueix al colonialisme i a l’occidentalització/Il·lustració l’abandonament d’aquella cosmovisió, Nanda es pregunta en el seu llibre si aquell passat va ser realment com es descriu i si l’occidentalització és tan negativa com apunten els intel·lectuals de l’anomenat “Tercer Món”. Centrada en el nacionalisme hindú i la ciència, la seva crítica, tanmateix, també es podria aplicar a Oyěwùmí en sintonia amb la crítica de Segato (2003) desenvolupada en aquella secció.","L’objectiu de Nanda és criticar el descrèdit de la ciència per part dels corrents postmoderns actuals. En poques paraules:","La Il·lustració era vista com l’agent del colonialisme, i la ciència moderna com un discurs del patriarcat i d’altres interessos occidentals dominants. La salvació residia a desemmascarar les pretensions universalistes de la ciència i fomentar formes alternatives de coneixement que posessin fi a l’arrogància d’Occident. Algú com jo només podia ser objecte de llàstima —i sovint ho era— per ser una “ment colonitzada”, enlluernada pels encants superficials d’Occident (pàg. xii).","En el llibre adverteix que els postmoderns s’han aliat amb els nacionalistes hindús de dretes. Com que la crítica a la ciència moderna és l’únic punt on conflueixen, els nacionalistes hindús proposen la ciència vèdica com a alternativa. Uns valors i una ciència que, segons Nanda, no fan sinó oprimir més la població i no són ni de bon tros la “descolonització de la ment” que es buscava (pàg. xv). Així també, si la ciència descobreix alguna cosa nova, sempre la poden explicar des de la ciència vèdica, cosa que s’ha anomenat “compartimentació”. «Els indis es modernitzen mantenint primer separats el que és modern i el que és tradicional, i després accepten lentament les innovacions modernes convertint-les simplement en una altra forma de tradició» (pàg. 174).","Nanda, per descriure la situació de l’Índia, es basa en el terme encunyat per Jeffrey Herf de “modernisme reaccionari”. En paraules de Nanda citant Herf, «el modernisme reaccionari és, senzillament, “l’adopció de la tecnologia moderna per part dels qui rebutgen la raó il·lustrada” (Herf 1984, 1)» (pàg. 7). «És la incompletesa del projecte de la Il·lustració, més que un excés d’aquest, el que explica el gir de l’Índia cap al modernisme reaccionari» (pàg. 43). La pregunta que esdevé rellevant sobre què busquen els nacionalistes hindús és: «Quins elements de l’herència índia busquen reviure?» (pàg. 17). Davant el descrèdit de la Modernitat, Nanda ens explica com la concep ella:","La Modernitat, tal com l’entenc, és sinònim de l’humanisme de la Il·lustració. La “Il·lustració” en sentit genèric és un esperit, una actitud de qüestionament dels dogmes heretats, resumida per Kant en el seu famós lema, <em>sapere aude</em> —“atreveix-te a saber”, assumeix el risc del descobriment, exerceix el dret a la crítica sense restriccions i accepta la solitud de l’autonomia (pàg. 18).","Una altra qüestió que assenyala Nanda és que aquesta crítica, que a Occident pot servir com a correcció a la fe cega en la raó, a l’Índia, com que no hi ha hagut una secularització efectiva de la societat i les seves institucions, serveix de fre al projecte de la Il·lustració (pàg. 28). Aquest rebuig a la Il·lustració i la demanda d’una ciència que provingui dels coneixements ancestrals no venen, tal com es podria pensar en un primer moment, de les persones que habiten els marges a l’Índia, ni dels pobres, sinó de les classes benestants (pàg. 31). Però, tal com afirma l’autora, «la secularització mai no ha significat la mort de Déu. És una exigència perquè Déu abandoni aquells àmbits de la vida —la naturalesa i la política, per exemple— on no té cabuda. La secularització consisteix a delimitar, però no a eliminar, l’àmbit de Déu» (pàg. 267).","Davant la ciència moderna “occidental”, els nacionalistes hindús presenten la ciència vèdica com una solució holista, que elimina la distinció entre subjecte i objecte, i defensen que està connectada amb els sabers ancestrals (pàg. 68). Per exemple, dins de la ciència vèdica es troba el ioga, pràctica que s’ha estès per Occident. «El veritable problema és que els nacionalistes hindús afirmen trobar tradició científica en elements equivocats de la tradició hindú» (pàg. 77).","Un altre concepte clau en l’obra de Nanda és el de “caritat epistèmica”. En paraules de l’autora:","Aquesta actitud de caritat i obertura mental envers totes les formes de conèixer la naturalesa és el que anomeno caritat epistèmica. Utilitzo la paraula “caritat” deliberadament, perquè vull transmetre les connotacions de condescendència i indulgència envers l’altre. Tanmateix, els qui defensen la igualtat de totes les formes de coneixement tenen motius nobles. Desitgen celebrar la diversitat de les cultures no occidentals, no masculines, no modernes i no capitalistes de tot el món. La fascinació per les diferents ciències s’alimenta de la creença que la recuperació d’aquestes formes alternatives de comprendre el món permetrà a la ciència moderna recuperar valors més humans, pacífics i ecològics, suposadament exemplificats per les dones i les cultures no occidentals i no modernes (pàg. 126).","Però el que s’amaga sota aquest noble afany és l’abandonament de la pretensió que depurin les seves creences d’elements irracionals que puguin ser perjudicials (vegeu, per exemple, la figura de l’intocable, més conegut com a pària, en la societat de castes índia) (pàg. 127). La conclusió portada a l’extrem és el que afirma Nanda a través de les paraules de Feyerabend: «que “si els contribuents de Califòrnia volen que les seves universitats estatals ensenyin vudú, medicina popular, astrologia, danses de la pluja, aleshores això és el que les universitats hauran d’ensenyar”» (1978, 87 [Feyerabend citat dins de Nanda (2003)]). Tot i així, crítics fervents de la ciència com Bruno Latour o Donna Haraway «neguen estar defensant un holisme premodern que justifiqui una societat d’organistes. Són conscients dels perills d’un tot indiferenciat i volen distanciar-se d’aquest tipus de pensament» (pàg. 141). Des d’aquesta perspectiva es pot arribar a afirmar el següent sobre el que l’autora anomena “Tercermundisme”:","L’argument habitual és que les dones de societats tradicionals, no occidentals, són més “epistemològicament privilegiades”, ja que els seus vincles amb la família i la naturalesa encara no han estat trencats per la modernitat. Les dones del Tercer Món són les postmodernes originals, les primeres cíborgs; a diferència dels científics occidentals/occidentalitzats que abstreuen i objectiven la naturalesa, elles experimenten les forces de la naturalesa com un continu amb les seves pròpies experiències quotidianes en la producció i el sosteniment de la vida. L’abstracció és masculina, opressiva i occidental, mentre que la interacció és femenina, alliberadora i oriental (pàg. 148).","La pregunta que emergeix aquí és: «Com han estat les vides d’homes i dones reals en societats regides per epistemologies i cosmovisions holístiques?» (pàg. 158). El problema torna a ser que allò que des d’Occident es veu com a sabers marginalitzats, en aquells països o cultures és hegemònic (pàg. 155). L’autora, cap al final d’aquesta secció, adverteix que el seu afany a denunciar aquest moviment d’unió entre fonamentalistes religiosos i postmoderns es basa en el fet que les «idees tenen conseqüències» (pàg. 159).","Tornant a la idea de “Tercermundisme”, aquesta idea forma part del nucli de l’ecofeminisme. Autores com Vandana Shiva afirmen que les dones tenen una relació especial amb la naturalesa. Proclamen que la persona i la naturalesa són una «dualitat en unitat». Tanmateix, Nanda adverteix que «qualsevol persona amb experiència de viure a l’Índia pot donar fe que la vida social en aquest país dista molt de ser una “dualitat dialèctica en la unitat”. Si la naturalesa es considerés, en efecte, un complement inseparable de la vida humana, per què els qui hi treballen —cultivant la terra, gestionant residus humans i animals, entrant en contacte amb cossos— són vistos com a persones contaminades i intocables?» (pàg. 228-229).","Com a conclusió, m’agradaria tornar al títol del llibre, “Profetes mirant enrere”. Què significa? Significa mirar enrere, idealitzant el passat com a solució als problemes del present. Els profetes serien els qui anunciarien i guiarien les persones perquè tornéssim a aquell passat ideal. Però precisament aquell passat ideal no existeix."]};

function sourceContent(a,lang){return{blocks:a.blocks.map((b,i)=>({kind:b.kind,html:lang==="ca"?CATALAN[a.id][i]:b.html})),bibliography:a.bibliography.map(r=>r.html)}}
function withYears(id,lang,text){return (YEAR_REPLACEMENTS[lang][id]||[]).reduce((s,[a,b])=>s.split(a).join(b),text)}
function bibliography(id,list,lang){const out=[...list];for(const ref of REQUIRED[id]||[]){const lead=ref.slice(0,ref.indexOf(".")+1);if(!out.some(x=>x.startsWith(lead)))out.push(ref)}out.sort((a,b)=>strip(a).localeCompare(strip(b),"es"));return lang==="ca"?out.map(x=>x.replaceAll("Trabajo original publicado","Treball original publicat").replaceAll("Trads.","Trad.").replaceAll("3 de octubre","3 d’octubre")):out}
function topbar(back=""){return `<header class="topbar"><a class="back-link translated" href="${back?"#"+back:"#"}">${back?"← "+(back==="map"?COPY[language].back:COPY[language].home):""}</a><div class="language-switcher" role="group" aria-label="Idioma"><button type="button" data-lang="es" aria-pressed="${language==="es"}">CAST</button><button type="button" data-lang="ca" aria-pressed="${language==="ca"}">CAT</button></div></header>`}

function author(id){const a=AUTHORS.find(x=>x.id===id);if(!a)return cover();const u=COPY[language],c=sourceContent(a,language);return `<div class="site">${topbar("map")}<main class="author-page" style="--accent:${a.color}"><header class="author-heading"><p class="concept-label">${u.colonialism} / ${a.concept[language]}</p><h1>${esc(a.name)}</h1></header><article class="reading-sheet" lang="${language}">${c.blocks.map(b=>{const h=withYears(a.id,language,b.html);return b.kind==="heading"?`<h2>${h}</h2>`:b.kind==="quote"?`<blockquote>${h}</blockquote>`:`<p class="${b.kind==="suggestion"?"suggestion":""}">${h}</p>`}).join("")}<section class="bibliography"><h2>${u.bibliography}</h2>${bibliography(a.id,c.bibliography,language).map(x=>`<p>${x}</p>`).join("")}</section></article><div class="author-links"><a class="return-link" href="#map">← ${u.back}</a></div></main></div>`}
