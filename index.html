<title>Pensament indisciplinat</title>
<style>
:root {
  --ink: #11100f;
  --paper: #f3efe5;
  --acid: #d8ff3e;
  --line: #11100f35;
  --title-font: "Helvetica Neue", Helvetica, sans-serif;
  --body-font: "Helvetica Neue Light", "HelveticaNeue-Light", "Helvetica Neue", Helvetica, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body-font); font-weight: 300; }
a { color: inherit; text-decoration: none; }
button { font: inherit; }
::selection { background: var(--acid); color: var(--ink); }
a:focus-visible, button:focus-visible { outline: 3px solid #f05a38; outline-offset: 6px; }
.topbar { height: 76px; padding: 0 4vw; display: flex; justify-content: space-between; align-items: center; background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
.language-switcher { display: flex; border: 1px solid var(--ink); border-radius: 999px; padding: 3px; gap: 2px; }
.language-switcher button { border: 0; border-radius: 999px; background: transparent; color: var(--ink); min-height: 38px; min-width: 62px; font-size: .875rem; font-weight: 750; cursor: pointer; transition: background .2s, color .2s; }
.language-switcher button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.translated { transition: opacity .3s cubic-bezier(.22, 1, .36, 1); }
.language-changing .translated { opacity: 0; }
.cover { min-height: calc(100svh - 76px); padding: clamp(3rem,8vh,7rem) 4vw 2rem; display: flex; flex-direction: column; }
.cover h1 { margin: auto 0; padding: 0 0 5rem; font-family: var(--body-font); font-size: clamp(2rem,9.5vw,10.4rem); font-weight: 400; line-height: .96; letter-spacing: -.055em; }
.cover h1 span { display: block; }
.cover h1 span:last-child { color: transparent; -webkit-text-stroke: 1.5px var(--ink); }
.cover-credits { display: grid; grid-template-columns: 1fr 1.25fr; gap: 8vw; align-items: start; }
.author-credit p { margin: 0 0 1.2rem; }
.author-credit p:first-child { font-size: clamp(1.3rem,2.4vw,2.1rem); font-weight: 650; line-height: 1.25; letter-spacing: -.035em; }
.author-credit p:last-child { font-size: 1rem; }
.project-credit { max-width: 660px; font-size: 1rem; line-height: 1.8; margin: 0; }
.title-link { display: block; width: fit-content; }
.title-link:hover { opacity: .75; }
.concept-section { background: var(--ink); color: var(--paper); padding: 2rem 4vw; min-height: calc(100svh - 76px); display: grid; align-items: center; }
.concept-map { width: 100%; max-width: 1400px; margin: auto; height: min(760px,75vw); min-height: 610px; position: relative; }
.threads { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.threads path { fill: none; stroke-width: 2; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.mobile-threads { display: none; }
.central-concept { position: absolute; left: 50%; top: 47.86%; transform: translate(-50%,-50%); margin: 0; border: 1px solid var(--acid); border-radius: 999px; padding: 1.1rem 2.2rem; background: var(--acid); color: var(--ink); font-size: clamp(1.5rem,3vw,2.7rem); font-weight: 600; letter-spacing: -.04em; }
.concept-node { position: absolute; transform: translate(-50%,-50%); display: flex; flex-direction: column; align-items: center; gap: .8rem; }
.node-pill { padding: .9rem 1.5rem; border: 1px solid var(--accent); border-radius: 999px; color: var(--accent); background: var(--ink); font-size: clamp(1.1rem,2.2vw,1.8rem); display: flex; align-items: center; gap: 1.1rem; white-space: nowrap; transition: color .2s, background .2s, transform .2s; }
.node-pill > span { font-size: 1rem; }
.concept-node:hover .node-pill { background: var(--accent); color: var(--ink); transform: translateY(-4px); }
.node-0 { left: 16.5%; top: 18.57%; }
.node-1 { left: 84.5%; top: 20.71%; }
.node-2 { left: 16.5%; top: 66.43%; }
.node-3 { left: 83.5%; top: 62.86%; }
.node-4 { left: 50%; top: 85%; }
.back-link { font-size: .9375rem; }
.author-page { padding: 4rem 4vw 5rem; max-width: 1240px; margin: auto; }
.author-heading { padding: 0 0 3rem; }
.concept-label { display: inline-block; padding: .6rem 1rem; border: 1px solid var(--ink); border-radius: 999px; background: var(--accent); font-size: .9375rem; }
.author-heading h1 { font-size: clamp(2.3rem,6vw,5.5rem); line-height: 1.16; font-weight: 700; letter-spacing: -.055em; margin: 1.5rem 0 0; overflow-wrap: anywhere; }
.reading-sheet { background: #faf8f2; border: 1px solid var(--line); border-top: 5px solid var(--accent); padding: clamp(1.3rem,5vw,5rem); }
.reading-sheet > *, .bibliography { max-width: 760px; margin-left: auto; margin-right: auto; }
.reading-sheet p { font-size: 1.0625rem; line-height: 1.95; margin-top: 0; margin-bottom: 1.7rem; overflow-wrap: anywhere; white-space: pre-wrap; }
.reading-sheet h2 { font-size: 1.6rem; font-weight: 650; line-height: 1.4; margin-top: 0; margin-bottom: 2rem; }
.reading-sheet em { font-style: italic; }
.reading-sheet strong { font-weight: 700; }
.reading-sheet blockquote { border-left: 3px solid var(--accent); padding: .5rem 0 .5rem 1.5rem; margin-top: 2rem; margin-bottom: 2rem; font-family: var(--body-font); font-size: 1.0625rem; line-height: 1.85; letter-spacing: .005em; white-space: pre-wrap; overflow-wrap: anywhere; }
.reading-sheet .suggestion { padding: 1rem 1.3rem; border-left: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.reading-sheet a { text-decoration: underline; text-underline-offset: 3px; }
.bibliography { border-top: 1px solid var(--ink); margin-top: 4rem; padding-top: 2rem; }
.bibliography p { padding-left: 1.5rem; text-indent: -1.5rem; font-size: 1rem; line-height: 1.8; }
.return-link { display: inline-block; padding: 1rem 0; margin-top: 2rem; border-bottom: 1px solid; font-size: 1rem; }
.author-links { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }

/* Unified typography: Helvetica Neue throughout the site */
html, body, button, input, textarea, select, a, p, h1, h2, h3, h4, h5, h6, blockquote, cite, span, label {
  font-family: var(--body-font);
}
.cover h1 {
  font-family: var(--body-font);
}


/* Force Helvetica Neue across every text element, including author sheets and quotes */
body, body *,
.reading-sheet, .reading-sheet *,
.author-page, .author-page *,
.bibliography, .bibliography *,
blockquote, blockquote *,
button, input, textarea, select {
  font-family: "Helvetica Neue Light", "HelveticaNeue-Light", "Helvetica Neue", Helvetica, sans-serif !important;
  font-weight: 300 !important;
}

@media (min-width: 1600px) { .cover h1 { font-size: 10.4rem; } }
/* Preserve the radial map and its SVG threads in portrait view. */
@media (max-width: 800px) {
  html { scroll-padding-top: 80px; }

  .back-link { font-size: .875rem; min-width: 0; min-height: 44px; display: flex; align-items: center; gap: .35rem; overflow-wrap: anywhere; }
  .language-switcher { flex-shrink: 0; }
  .language-switcher button { min-width: 52px; min-height: 44px; }
  .cover { min-height: calc(100svh - 72px); padding: clamp(2rem, 8svh, 4rem) 5vw max(1.5rem, env(safe-area-inset-bottom)); }
  .cover h1 { font-size: min(9vw, 4.5rem); padding-bottom: 2.5rem; margin: 0 0 auto; line-height: 1.16; }
  .cover h1 span:last-child { -webkit-text-stroke-width: 1px; }
  .cover-credits { grid-template-columns: minmax(0, 1fr); gap: 1.25rem; }
  .author-credit p:first-child { font-size: 1.5rem; }
  .project-credit { font-size: 1rem; line-height: 1.7; overflow-wrap: anywhere; }
  .concept-section { padding: 1rem 3vw; min-height: calc(100svh - 72px); }
  .concept-map { height: clamp(440px, calc(100svh - 104px), 720px); min-height: 0; max-width: 40rem; display: block; }
  .desktop-threads { display: block; }
  .mobile-threads { display: none; }
  .central-concept { font-size: clamp(1.15rem, 4.8vw, 2rem); padding: .8rem 1rem; }
  .concept-node { max-width: 40%; }
  .node-0, .node-2 { left: 20%; }
  .node-1, .node-3 { left: 80%; }
  .node-pill { font-size: clamp(.875rem, 3.5vw, 1.25rem); padding: .75rem .65rem; min-height: 44px; gap: .35rem; }
  .node-pill > span { font-size: .875rem; }
  .author-page { padding: 2rem 4vw 3rem; }
  .author-heading { padding-bottom: 1.5rem; }
  .author-heading h1 { font-size: clamp(2rem, 9vw, 3.5rem); }
  .concept-label { line-height: 1.5; overflow-wrap: anywhere; }
  .reading-sheet { padding: 1.3rem clamp(1rem, 4vw, 2rem); }
  .reading-sheet p { font-size: 1rem; line-height: 1.8; }
  .reading-sheet h2 { font-size: 1.35rem; overflow-wrap: anywhere; }
  .reading-sheet blockquote { font-size: 1.025rem; line-height: 1.8; padding: .25rem 0 .25rem .85rem; margin-top: 1.5rem; margin-bottom: 1.5rem; }
  .reading-sheet .suggestion { padding: .85rem; }
  .bibliography { margin-top: 2.5rem; }
  .bibliography p { padding-left: 1rem; text-indent: -1rem; }
  .return-link { min-height: 44px; }
  .author-links { align-items: flex-end; }
}
@media (max-width: 380px) {
  .topbar { gap: .5rem; padding-left: .75rem; padding-right: .75rem; }
  .language-switcher button { min-width: 46px; }
}
@media (max-height: 500px) and (orientation: landscape) {
  .cover { min-height: auto; padding-top: 2rem; }
  .cover h1 { font-size: min(8vw, 4rem); }
}
@media (hover: none) {
  .concept-node:hover .node-pill { transform: none; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; } }

/* Fade through the page background without reloading between cover and map. */
.site { background: var(--paper); transition: background-color 700ms ease; }
.site.map-view { background: var(--ink); }
.page-surface { opacity: 1; transition: opacity 420ms cubic-bezier(.4, 0, .2, 1); }
.site[data-page-phase="leaving"] .page-surface { opacity: 0; pointer-events: none; }
.site[data-page-phase="entering"] .page-surface { animation: page-appear 700ms cubic-bezier(.22, 1, .36, 1) both; }
.title-link { transition: opacity 300ms ease; }
@keyframes page-appear { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .site, .page-surface { transition: none; }
  .site[data-page-phase="entering"] .page-surface { animation: none; }
}

const AUTHORS=[{"id":"valencia","name":"Sayak Valencia","concept":{"es":"Económico","ca":"Econòmic"},"color":"#f05a38","blocks":[{"html":"Un crimen conmocionó a Argentina recientemente, tres chicas, Brenda Loreley del Castillo (20 años), Morena Verdi (20 años) y Lara Morena Gutiérrez (15 años), desaparecieron el 19 de septiembre de 2025 en Buenos Aires. Sus cuerpos fueron encontrados cinco días después, enterrados en un pozo, y presentaban signos de tortura y mutilaciones. Realizaban trabajo sexual y se les ofrecieron 300 dólares a cada una por mantener relaciones sexuales. Quedaron en que las recogerían el viernes 19 de septiembre y, después de eso, se les perdió el rastro. Según el diario Clarín, fue «una venganza narco planificada». Tal como dice la fuente, «la principal hipótesis la introdujo manera informal uno de los primeros detenidos en la causa que, según le relató a la Policía, una de las víctimas “se habría quedado” con un monto de entre 60 y 70 mil dólares o cuatro kilos de cocaína». La tortura y el asesinato se retransmitieron por una plataforma a un grupo reducido de entre 40 y 45 personas. «“Esto le pasa a los que me roban”, habría sido el mensaje que quería dar el autor intelectual del triple crimen de Brenda, Morena y Lara». ","text":"Un crimen conmocionó a Argentina recientemente, tres chicas, Brenda Loreley del Castillo (20 años), Morena Verdi (20 años) y Lara Morena Gutiérrez (15 años), desaparecieron el 19 de septiembre de 2025 en Buenos Aires. Sus cuerpos fueron encontrados cinco días después, enterrados en un pozo, y presentaban signos de tortura y mutilaciones. Realizaban trabajo sexual y se les ofrecieron 300 dólares a cada una por mantener relaciones sexuales. Quedaron en que las recogerían el viernes 19 de septiembre y, después de eso, se les perdió el rastro. Según el diario Clarín, fue «una venganza narco planificada». Tal como dice la fuente, «la principal hipótesis la introdujo manera informal uno de los primeros detenidos en la causa que, según le relató a la Policía, una de las víctimas “se habría quedado” con un monto de entre 60 y 70 mil dólares o cuatro kilos de cocaína». La tortura y el asesinato se retransmitieron por una plataforma a un grupo reducido de entre 40 y 45 personas. «“Esto le pasa a los que me roban”, habría sido el mensaje que quería dar el autor intelectual del triple crimen de Brenda, Morena y Lara». ","kind":"paragraph"},{"html":"Valencia, en su obra en su obra <em>Capitalismo Gore</em> (2010), justamente reflexiona sobre este tipo de casos. Ella hace un análisis agudo sobre el capitalismo en el contexto de México, concretamente en Tijuana, que está en la frontera con EEUU, nos proporciona un concepto clave en el análisis del estadio del capitalismo que estamos viviendo. Ella lo denomina “capitalismo gore”, definido como la «reinterpretación dada a la economía hegemónica y global en los espacios (geográficamente) fronterizos» (pág 15). Sería como una especie de colonización económica, ya que se da, según sus palabras «en los intersticios del capitalismo [donde] nadie tiene nada que perder, porque la vida (el último de los grandes tabúes) ya no es importante» (pág 21). Aunque se centre en el Tercer Mundo en su análisis, hay que huir de interpretarlo","text":"Valencia, en su obra en su obra Capitalismo Gore (2010), justamente reflexiona sobre este tipo de casos. Ella hace un análisis agudo sobre el capitalismo en el contexto de México, concretamente en Tijuana, que está en la frontera con EEUU, nos proporciona un concepto clave en el análisis del estadio del capitalismo que estamos viviendo. Ella lo denomina “capitalismo gore”, definido como la «reinterpretación dada a la economía hegemónica y global en los espacios (geográficamente) fronterizos» (pág 15). Sería como una especie de colonización económica, ya que se da, según sus palabras «en los intersticios del capitalismo [donde] nadie tiene nada que perder, porque la vida (el último de los grandes tabúes) ya no es importante» (pág 21). Aunque se centre en el Tercer Mundo en su análisis, hay que huir de interpretarlo","kind":"paragraph"},{"html":"«como una desestructuración que nos muestra los fallos en la aplicación del sistema, ya que […] [es] un panorama de la suerte en la que se desenvolverá el Primer Mundo futuro, dadas las lógicas globales del capitalismo, sólo que reflejado en el Tercer Mundo de una forma acelerada e hiperpresente que ha devenido gore» (pág 194-195).","text":"«como una desestructuración que nos muestra los fallos en la aplicación del sistema, ya que […] [es] un panorama de la suerte en la que se desenvolverá el Primer Mundo futuro, dadas las lógicas globales del capitalismo, sólo que reflejado en el Tercer Mundo de una forma acelerada e hiperpresente que ha devenido gore» (pág 194-195).","kind":"quote"},{"html":"Valencia examina en su obra “Capitalismo Gore” los cárteles de droga y la violencia que ejercen. Ella relaciona la existencia de estos con la precarización de la economía y la búsqueda de hacer dinero rápido (pág 36 y 41). Denomina a las personas que se dedican a esto “sujetos endriagos”, es decir, «emprendedores del capitalismo gore» (pág 46). La «sobreespecialización de la violencia [se convierte] no sólo en un trabajo normal sino en un trabajo deseable al ofrecer «oportunidades de superación» frente a la precarización global del trabajo» (pág 47). Esto es causado por «las exigencias del orden económico actual [que] conducen a la creación de un orden subyacente que hace de la violencia un arma de producción y la globaliza» (pág 53). Esta violencia en palabras de la autora, es «un postcolonialismo in extremis […] recolonizado a través del hiperconsumismo y la frustración» (pág 56). ","text":"Valencia examina en su obra “Capitalismo Gore” los cárteles de droga y la violencia que ejercen. Ella relaciona la existencia de estos con la precarización de la economía y la búsqueda de hacer dinero rápido (pág 36 y 41). Denomina a las personas que se dedican a esto “sujetos endriagos”, es decir, «emprendedores del capitalismo gore» (pág 46). La «sobreespecialización de la violencia [se convierte] no sólo en un trabajo normal sino en un trabajo deseable al ofrecer «oportunidades de superación» frente a la precarización global del trabajo» (pág 47). Esto es causado por «las exigencias del orden económico actual [que] conducen a la creación de un orden subyacente que hace de la violencia un arma de producción y la globaliza» (pág 53). Esta violencia en palabras de la autora, es «un postcolonialismo in extremis […] recolonizado a través del hiperconsumismo y la frustración» (pág 56). ","kind":"paragraph"},{"html":"En Sayak Valencia se cruzan dos autoras del proyecto, a saber, Oyèrónkẹ Oyěwùmí y Suely Rolnik, ya que, la primera expuso las consecuencias que trajo la colonización a la población yorùbá mientras que Valencia analiza el neocolonialismo y la colonización económica de México y sus efectos devastadores. Por otro lado, también se pueden apreciar resonancias con el planteamiento de Rolnik ya que al fin y al cabo el sujeto endriago es secuestro de la fuerza vital del que nos hablaba la autora brasileña. ","text":"En Sayak Valencia se cruzan dos autoras del proyecto, a saber, Oyèrónkẹ Oyěwùmí y Suely Rolnik, ya que, la primera expuso las consecuencias que trajo la colonización a la población yorùbá mientras que Valencia analiza el neocolonialismo y la colonización económica de México y sus efectos devastadores. Por otro lado, también se pueden apreciar resonancias con el planteamiento de Rolnik ya que al fin y al cabo el sujeto endriago es secuestro de la fuerza vital del que nos hablaba la autora brasileña. ","kind":"paragraph"},{"html":"Este sujeto endriago es heroizado, se lo alaba e incluso se escriben canciones sobre él (como los narcocorridos). Es el sujeto que ha «ascendido socialmente» mediante el consumismo (pág. 71). La mayoría son hombres que, en defensa de su masculinidad y de su papel como proveedores y ante la precariedad económica, se decantan por este camino (pág. 90 y 91). Son vistos con simpatía por algunos, ya que en ocasiones cumplen la función del Estado (pág. 72). El giro ético que se ha producido, en palabras de la autora, es que «el imperativo categórico ha sido desplazado por el imperativo económico» (pág. 78). Tal como dice la autora:","text":"Este sujeto endriago es heroizado, se lo alaba e incluso se escriben canciones sobre él (como los narcocorridos). Es el sujeto que ha «ascendido socialmente» mediante el consumismo (pág. 71). La mayoría son hombres que, en defensa de su masculinidad y de su papel como proveedores y ante la precariedad económica, se decantan por este camino (pág. 90 y 91). Son vistos con simpatía por algunos, ya que en ocasiones cumplen la función del Estado (pág. 72). El giro ético que se ha producido, en palabras de la autora, es que «el imperativo categórico ha sido desplazado por el imperativo económico» (pág. 78). Tal como dice la autora:","kind":"paragraph"},{"html":"Ya no existen los códigos de honor o de respeto hacia las mujeres y l@s niñ@s; ahora los únicos códigos que hay que seguir están dictados por la economía, que impone asesinar sin distinción alguna de género o edad, si este hecho incrementa sus ganancias o su competitividad en el mercado criminal (pág. 106).","text":"Ya no existen los códigos de honor o de respeto hacia las mujeres y l@s niñ@s; ahora los únicos códigos que hay que seguir están dictados por la economía, que impone asesinar sin distinción alguna de género o edad, si este hecho incrementa sus ganancias o su competitividad en el mercado criminal (pág. 106).","kind":"quote"},{"html":"Esto desemboca en el «necropoder», es decir, «la apropiación y aplicación de las tecnologías gubernamentales de la biopolítica para subyugar los cuerpos y las poblaciones, que integra como elemento fundamental la sobreespecialización de la violencia y tiene como finalidad comerciar con el proceso de dar muerte» (pág. 147). Cabe remarcar que, aunque los sujetos endriagos se oponen al Estado y son una consecuencia del neoliberalismo en países precarizados por el sistema económico, en absoluto son héroes ni sujetos revolucionarios, sino simplemente «un empresario que aplica y sintetiza literalmente las lógicas y las demandas neoliberales más aberrantes» (pág. 145).","text":"Esto desemboca en el «necropoder», es decir, «la apropiación y aplicación de las tecnologías gubernamentales de la biopolítica para subyugar los cuerpos y las poblaciones, que integra como elemento fundamental la sobreespecialización de la violencia y tiene como finalidad comerciar con el proceso de dar muerte» (pág. 147). Cabe remarcar que, aunque los sujetos endriagos se oponen al Estado y son una consecuencia del neoliberalismo en países precarizados por el sistema económico, en absoluto son héroes ni sujetos revolucionarios, sino simplemente «un empresario que aplica y sintetiza literalmente las lógicas y las demandas neoliberales más aberrantes» (pág. 145).","kind":"paragraph"},{"html":"Este necropoder es el que explica, en última instancia, el hecho de haber matado a las tres chicas con tanta crueldad. No se trata solo de un asesinato, sino de una práctica de gobernanza a través de la violencia. La retransmisión del crimen a un grupo reducido de espectadores muestra cómo la violencia no solo se ejerce, sino que se consume y se distribuye, convirtiéndose en un producto dentro del mercado criminal. En este sentido, la sobreespecialización de la violencia de la que habla Valencia se hace evidente tanto en las mutilaciones como en la puesta en escena del castigo. Es, así, una «lección»: si me traicionas (supuestamente una de ellas le robó dinero), yo te daré una lección a ti y al resto. Esta violencia no es arbitraria, sino ejemplar y comunicativa, produce terror. Se trata de posicionarse en el poder y de hacer recordar quién manda, ejerciendo una forma de soberanía que no pasa por el Estado, sino por la capacidad de dar muerte, es decir, por el necropoder.","text":"Este necropoder es el que explica, en última instancia, el hecho de haber matado a las tres chicas con tanta crueldad. No se trata solo de un asesinato, sino de una práctica de gobernanza a través de la violencia. La retransmisión del crimen a un grupo reducido de espectadores muestra cómo la violencia no solo se ejerce, sino que se consume y se distribuye, convirtiéndose en un producto dentro del mercado criminal. En este sentido, la sobreespecialización de la violencia de la que habla Valencia se hace evidente tanto en las mutilaciones como en la puesta en escena del castigo. Es, así, una «lección»: si me traicionas (supuestamente una de ellas le robó dinero), yo te daré una lección a ti y al resto. Esta violencia no es arbitraria, sino ejemplar y comunicativa, produce terror. Se trata de posicionarse en el poder y de hacer recordar quién manda, ejerciendo una forma de soberanía que no pasa por el Estado, sino por la capacidad de dar muerte, es decir, por el necropoder.","kind":"paragraph"},{"html":"Aquí la precarización económica es central y opera en ambas direcciones. Por una parte, las tres chicas realizaban trabajo sexual para poder sacar adelante a sus familias; en el caso de Lara, de solo 15 años, hay que hablar más bien de explotación sexual. Por otra, los narcotraficantes entienden la violencia como una forma de producción y acumulación de capital, una vía de acceso rápido a recursos y estatus dentro del marco del capitalismo gore.","text":"Aquí la precarización económica es central y opera en ambas direcciones. Por una parte, las tres chicas realizaban trabajo sexual para poder sacar adelante a sus familias; en el caso de Lara, de solo 15 años, hay que hablar más bien de explotación sexual. Por otra, los narcotraficantes entienden la violencia como una forma de producción y acumulación de capital, una vía de acceso rápido a recursos y estatus dentro del marco del capitalismo gore.","kind":"paragraph"},{"html":"Además, este ejercicio de la violencia está profundamente atravesado por la masculinidad. Tal como señala Valencia, muchos de estos sujetos endriagos son hombres que, ante la precariedad, buscan reafirmar su rol de proveedores y su posición de poder mediante la violencia (pág. 90-91). En este caso, el control, la tortura y la exhibición de los cuerpos femeninos pueden leerse también como una forma extrema de dominación masculina, donde el cuerpo de las mujeres se convierte en el espacio en el que se inscribe este poder.","text":"Además, este ejercicio de la violencia está profundamente atravesado por la masculinidad. Tal como señala Valencia, muchos de estos sujetos endriagos son hombres que, ante la precariedad, buscan reafirmar su rol de proveedores y su posición de poder mediante la violencia (pág. 90-91). En este caso, el control, la tortura y la exhibición de los cuerpos femeninos pueden leerse también como una forma extrema de dominación masculina, donde el cuerpo de las mujeres se convierte en el espacio en el que se inscribe este poder.","kind":"paragraph"}],"bibliography":[{"html":"Dalbe, E. (2025, 3 de octubre). Triple crimen de Florencio Varela: por qué mataron a las chicas, la incógnita que aun persiste. <em>Clarín</em>. <a href=\"https://www.clarin.com/policiales/triple-crimen-florencio-varela-mataron-chicas-incognita-persiste_0_5ShTnryQ5F.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.clarin.com/policiales/triple-crimen-florencio-varela-mataron-chicas-incognita-persiste_0_5ShTnryQ5F.html</a>","text":"Dalbe, E. (2025, 3 de octubre). Triple crimen de Florencio Varela: por qué mataron a las chicas, la incógnita que aun persiste. Clarín. https://www.clarin.com/policiales/triple-crimen-florencio-varela-mataron-chicas-incognita-persiste_0_5ShTnryQ5F.html"},{"html":"Valencia, S. (2010). <em>Capitalismo gore</em>. Editorial Melusina. ","text":"Valencia, S. (2010). Capitalismo gore. Editorial Melusina. "}]},{"id":"rolnik","name":"Suely Rolnik","concept":{"es":"Mental","ca":"Mental"},"color":"#9f7aea","blocks":[{"html":"Horkheimer y Adorno en su libro <em>Dialéctica de la Ilustración</em> (1998), hablan de como en la industria cultural las diferencias se han eliminado. «Se puede siempre captar de inmediato en una película cómo terminará, quién será recompensado, castigado u olvidado» (pág 170). Los productos culturales que tenemos, en su opinión, no están hechos para que pensemos, sino para que consumamos. Para que seamos sujetos pasivos (pág 171). Esta industria encarna el paradigma neoliberal. «El amo ya no dice: “Pensad como yo o moriréis”. Dice: “Sois libres de pensar como yo […]”». A quienes va dirigido toda la industria cultural es específicamente a la clase obrera. Se infiltra como ideología (pág 178). Así, Horkheimer y Adorno afirman que ","text":"Horkheimer y Adorno en su libro Dialéctica de la Ilustración (1998), hablan de como en la industria cultural las diferencias se han eliminado. «Se puede siempre captar de inmediato en una película cómo terminará, quién será recompensado, castigado u olvidado» (pág 170). Los productos culturales que tenemos, en su opinión, no están hechos para que pensemos, sino para que consumamos. Para que seamos sujetos pasivos (pág 171). Esta industria encarna el paradigma neoliberal. «El amo ya no dice: “Pensad como yo o moriréis”. Dice: “Sois libres de pensar como yo […]”». A quienes va dirigido toda la industria cultural es específicamente a la clase obrera. Se infiltra como ideología (pág 178). Así, Horkheimer y Adorno afirman que ","kind":"paragraph"},{"html":"«la industria cultural sigue siendo la industria de la diversión. […] La diversión es la prolongación del trabajo bajo el capitalismo tardío. Es buscada por quien quiere sustraerse al proceso de trabajo mecanizado para poder estar de nuevo a su altura, en condiciones de afrontarlo» (pág 181). ","text":"«la industria cultural sigue siendo la industria de la diversión. […] La diversión es la prolongación del trabajo bajo el capitalismo tardío. Es buscada por quien quiere sustraerse al proceso de trabajo mecanizado para poder estar de nuevo a su altura, en condiciones de afrontarlo» (pág 181). ","kind":"quote"},{"html":"Esta industria es totalmente prescindible según los autores (pág 183). «En la época de la expansión liberal la diversión vivía de la fe en el futuro: todo seguiría así y, no obstante, iría a mejor. Hoy la fe vuelve a espiritualizarse; se hace tan sutil que pierde de vista toda meta y queda reducida al fondo dorado que se proyecta detrás de lo real» (pág 188). ","text":"Esta industria es totalmente prescindible según los autores (pág 183). «En la época de la expansión liberal la diversión vivía de la fe en el futuro: todo seguiría así y, no obstante, iría a mejor. Hoy la fe vuelve a espiritualizarse; se hace tan sutil que pierde de vista toda meta y queda reducida al fondo dorado que se proyecta detrás de lo real» (pág 188). ","kind":"paragraph"},{"html":"Esta cuestión de cómo nos han colonizado la mente (o el inconsciente) es la que se plantea Suely Rolnik en su libro llamado <em>Esferas de la insurrección. Apuntes para descolonizar el inconsciente</em><em> </em>(2019). Rolnik, seguidora de Deleuze y Guattari, nos propone en su obra una serie de reflexiones y herramientas para solucionar esta cuestión. La tesis es que el capitalismo se está apropiando de la potencia creadora, de la fuerza vital de creación, canalizándola. Así, «la resistencia actualmente pasaría por un esfuerzo de reapropiación colectiva de esa potencia» (pág 28). Rolnik propone «designar como “inconsciente colonial-capitalístico” a la política del inconsciente dominante en este régimen» (pág 31).  ","text":"Esta cuestión de cómo nos han colonizado la mente (o el inconsciente) es la que se plantea Suely Rolnik en su libro llamado Esferas de la insurrección. Apuntes para descolonizar el inconsciente (2019). Rolnik, seguidora de Deleuze y Guattari, nos propone en su obra una serie de reflexiones y herramientas para solucionar esta cuestión. La tesis es que el capitalismo se está apropiando de la potencia creadora, de la fuerza vital de creación, canalizándola. Así, «la resistencia actualmente pasaría por un esfuerzo de reapropiación colectiva de esa potencia» (pág 28). Rolnik propone «designar como “inconsciente colonial-capitalístico” a la política del inconsciente dominante en este régimen» (pág 31).  ","kind":"paragraph"},{"html":"Rolnik, para ejemplificar dos maneras de crear, se basa en la exposición <em>Caminhando</em> de Lygia Clark. Se ofrece una cinta de Möbius, unas «tiras de papel, tijeras y cola de pegar, junto con instrucciones de uso breves y sencillas, con una sola advertencia: cada vez que encuentren un punto elegido anteriormente para perforar la superficie, deben evitarlo para seguir recortando» (pág 37). Así se sigue hasta que ya no se pueda cortar más longitudinalmente. «En caso de que no sigamos las instrucciones de la artista e insistamos en volver a cortar a partir de un punto ya perforado, el resultado es la reproducción infinita de su forma inicial» (pág 41). Si seguimos las instrucciones de Clark, se aplica la potencia creadora, la pulsión vital, mientras que si ignoramos estas recomendaciones, se produce la reproducción de lo mismo. Es lo que Deleuze y Guattari diferenciaron entre repetición desnuda («repetición de lo Mismo» (pág 45)), y repetición vestida, es decir, «la repetición extraordinaria o singular» (pág 331). Siguiendo con la autora brasileña tendríamos dos movimientos; «el movimiento que presiona a la subjetividad en dirección a “la conservación de las formas en que la vida se encuentra materializada” y, por el otro lado, el movimiento que la presiona en dirección “a la conservación de la vida en su potencia de germinación”» (pág 49). ","text":"Rolnik, para ejemplificar dos maneras de crear, se basa en la exposición Caminhando de Lygia Clark. Se ofrece una cinta de Möbius, unas «tiras de papel, tijeras y cola de pegar, junto con instrucciones de uso breves y sencillas, con una sola advertencia: cada vez que encuentren un punto elegido anteriormente para perforar la superficie, deben evitarlo para seguir recortando» (pág 37). Así se sigue hasta que ya no se pueda cortar más longitudinalmente. «En caso de que no sigamos las instrucciones de la artista e insistamos en volver a cortar a partir de un punto ya perforado, el resultado es la reproducción infinita de su forma inicial» (pág 41). Si seguimos las instrucciones de Clark, se aplica la potencia creadora, la pulsión vital, mientras que si ignoramos estas recomendaciones, se produce la reproducción de lo mismo. Es lo que Deleuze y Guattari diferenciaron entre repetición desnuda («repetición de lo Mismo» (pág 45)), y repetición vestida, es decir, «la repetición extraordinaria o singular» (pág 331). Siguiendo con la autora brasileña tendríamos dos movimientos; «el movimiento que presiona a la subjetividad en dirección a “la conservación de las formas en que la vida se encuentra materializada” y, por el otro lado, el movimiento que la presiona en dirección “a la conservación de la vida en su potencia de germinación”» (pág 49). ","kind":"paragraph"},{"html":"Volviendo al tema del arte, el régimen colonial-proxenetístico busca apropiarse de la fuerza creadora del arte, colonizarlo para que corte por el mismo lado y no por otro. Dos objetivos tiene; por un lado, «neutralizar la fuerza transfiguradora de las prácticas artísticas», por otro, «valerse del arte como pasaporte de admisión en los salones internacionales de las élites del capitalismo financierizado» (pág 83). Rolnik destaca la importancia de luchar en la esfera micropolítica (inconsciente, afectos, fuerzas, etc.) y no solo en la macropolítica (política estatal, democracia representativa, instituciones, etc.). ","text":"Volviendo al tema del arte, el régimen colonial-proxenetístico busca apropiarse de la fuerza creadora del arte, colonizarlo para que corte por el mismo lado y no por otro. Dos objetivos tiene; por un lado, «neutralizar la fuerza transfiguradora de las prácticas artísticas», por otro, «valerse del arte como pasaporte de admisión en los salones internacionales de las élites del capitalismo financierizado» (pág 83). Rolnik destaca la importancia de luchar en la esfera micropolítica (inconsciente, afectos, fuerzas, etc.) y no solo en la macropolítica (política estatal, democracia representativa, instituciones, etc.). ","kind":"paragraph"},{"html":"Conectando con el planteamiento de Sayak Valencia, Rolnik nos avisa que: ","text":"Conectando con el planteamiento de Sayak Valencia, Rolnik nos avisa que: ","kind":"paragraph"},{"html":"Nada garantiza que todos los subalternos sean, por principio, agentes potenciales de la insubordinación micropolítica, ya que su subjetividad puede estar bajo el hechizo del inconsciente propio al régimen dominante, aunque lo combatan macropolíticamente (pág 118). ","text":"Nada garantiza que todos los subalternos sean, por principio, agentes potenciales de la insubordinación micropolítica, ya que su subjetividad puede estar bajo el hechizo del inconsciente propio al régimen dominante, aunque lo combatan macropolíticamente (pág 118). ","kind":"quote"},{"html":"El capital de hecho coloniza sus mentes para que, como hemos visto antes, redirijan su energía vital hacia la reproducción de este. Como he planteado en la exposición de Valencia, ante el auge consumista y el deseo de formar parte de ello, lo que crea en zonas precarizadas es el surgimiento del sujeto endriago. Sujeto, que lejos de ser insubordinado, encarna el mandato capitalista y la masculinidad (si se pueden concebir como separados). ","text":"El capital de hecho coloniza sus mentes para que, como hemos visto antes, redirijan su energía vital hacia la reproducción de este. Como he planteado en la exposición de Valencia, ante el auge consumista y el deseo de formar parte de ello, lo que crea en zonas precarizadas es el surgimiento del sujeto endriago. Sujeto, que lejos de ser insubordinado, encarna el mandato capitalista y la masculinidad (si se pueden concebir como separados). ","kind":"paragraph"},{"html":"El objetivo es alcanzar «en cada situación un umbral que permita que la fuerza vital creadora se libere, al menos lo suficiente, de su proxenetismo» (pág 129). Así, la descolonización del inconsciente es una tarea que no tiene fin, es un proceso continuo y no un objetivo. En palabras de Rolnik; ","text":"El objetivo es alcanzar «en cada situación un umbral que permita que la fuerza vital creadora se libere, al menos lo suficiente, de su proxenetismo» (pág 129). Así, la descolonización del inconsciente es una tarea que no tiene fin, es un proceso continuo y no un objetivo. En palabras de Rolnik; ","kind":"paragraph"},{"html":"Desear este acontecimiento de una vida no cafisheada, es el antídoto para la patología del régimen colonial-capitalístico, que nos hace desear el goce del poder –un goce propio de una subjetividad reducida al sujeto, que ha perdido la conexión con la vida y cuya ceguera nos lleva a un miserable narcisismo devastador– (pág 132). ","text":"Desear este acontecimiento de una vida no cafisheada, es el antídoto para la patología del régimen colonial-capitalístico, que nos hace desear el goce del poder –un goce propio de una subjetividad reducida al sujeto, que ha perdido la conexión con la vida y cuya ceguera nos lleva a un miserable narcisismo devastador– (pág 132). ","kind":"quote"},{"html":"Como último reproduzco aquí las diez sugerencias que hace Rolnik para descolonizar el inconsciente: ","text":"Como último reproduzco aquí las diez sugerencias que hace Rolnik para descolonizar el inconsciente: ","kind":"paragraph"},{"html":"1. Desanestesiar nuestra vulnerabilidad a las fuerzas en sus diagramas variables, potencia de la subjetividad en su experiencia fuera-del-sujeto. ","text":"1. Desanestesiar nuestra vulnerabilidad a las fuerzas en sus diagramas variables, potencia de la subjetividad en su experiencia fuera-del-sujeto. ","kind":"suggestion"},{"html":"2. Activar el saber eco-etológico y expandirlo a lo largo de nuestra existencia: la experiencia del mundo en su condición de viviente, cuyas fuerzas producen efectos en nuestro cuerpo, el cual pertenece a esa misma condición y la comparte con todos los elementos que componen el cuerpo vivo de la biósfera. ","text":"2. Activar el saber eco-etológico y expandirlo a lo largo de nuestra existencia: la experiencia del mundo en su condición de viviente, cuyas fuerzas producen efectos en nuestro cuerpo, el cual pertenece a esa misma condición y la comparte con todos los elementos que componen el cuerpo vivo de la biósfera. ","kind":"suggestion"},{"html":"3. Desobstruir cada vez más el acceso a la tensa experiencia del extraño-familiar. ","text":"3. Desobstruir cada vez más el acceso a la tensa experiencia del extraño-familiar. ","kind":"suggestion"},{"html":"4. No denegar la fragilidad resultante de la desterritorialización desestabilizadora que el estado extraño-familiar promueve inevitablemente. ","text":"4. No denegar la fragilidad resultante de la desterritorialización desestabilizadora que el estado extraño-familiar promueve inevitablemente. ","kind":"suggestion"},{"html":"5. No interpretar la fragilidad de este estado inestable y su incomodidad como “algo malo”, ni proyectar sobre este malestar lecturas fantasmáticas (eyaculaciones precoces del ego, provocadas por su miedo al desamparo y a la falencia y sus consecuencias imaginarias: el repudio, el rechazo, la exclusión social, la humillación, la locura). Estas proyecciones son portadoras de falsas explicaciones para la causa del malestar, las cuales siempre lo asocian a un supuesto error y, por ende, a la culpa, ya sea la nuestra o la de un otro cualquiera. ","text":"5. No interpretar la fragilidad de este estado inestable y su incomodidad como “algo malo”, ni proyectar sobre este malestar lecturas fantasmáticas (eyaculaciones precoces del ego, provocadas por su miedo al desamparo y a la falencia y sus consecuencias imaginarias: el repudio, el rechazo, la exclusión social, la humillación, la locura). Estas proyecciones son portadoras de falsas explicaciones para la causa del malestar, las cuales siempre lo asocian a un supuesto error y, por ende, a la culpa, ya sea la nuestra o la de un otro cualquiera. ","kind":"suggestion"},{"html":"6. No ceder a la voluntad de conservación de las formas de existencia y a la presión que esta ejerce contra la voluntad de potencia de la vida en su impulso de producción de diferencia. Al contrario, buscar sostenerse en el hilo tenue de este estado inestable hasta que la imaginación creadora construya un modo de cuerpo-y-habla que, al ser portador de la pulsión de lo extraño-familiar, sea capaz de actualizar el mundo virtual que esta experiencia anuncia, permitiendo así que las formas agónicas terminen de morirse. ","text":"6. No ceder a la voluntad de conservación de las formas de existencia y a la presión que esta ejerce contra la voluntad de potencia de la vida en su impulso de producción de diferencia. Al contrario, buscar sostenerse en el hilo tenue de este estado inestable hasta que la imaginación creadora construya un modo de cuerpo-y-habla que, al ser portador de la pulsión de lo extraño-familiar, sea capaz de actualizar el mundo virtual que esta experiencia anuncia, permitiendo así que las formas agónicas terminen de morirse. ","kind":"suggestion"},{"html":"7. No atropellar el tiempo propio de la imaginación creadora, para evitar el riesgo de interrumpir la germinación de un mundo. Tal interrupción vuelve a la imaginación vulnerable a la expropiación por el régimen colonial-cafisheístico que la desvía de su destino ético. Es en este desvío que es capturada y tiende a someterse al imaginario que este régimen nos impone seductoramente, lo que la vuelve totalmente estéril. Es que en el lugar del ejercicio de la creación de lo nuevo (exigido por la vida), la imaginación pasa a reducirse al ejercicio de su capacidad creativa (disociada de la vida) para producir novedades, las cuales multiplican las oportunidades para las inversiones de capital y excitan la voluntad de consumo en una velocidad exponencial. ","text":"7. No atropellar el tiempo propio de la imaginación creadora, para evitar el riesgo de interrumpir la germinación de un mundo. Tal interrupción vuelve a la imaginación vulnerable a la expropiación por el régimen colonial-cafisheístico que la desvía de su destino ético. Es en este desvío que es capturada y tiende a someterse al imaginario que este régimen nos impone seductoramente, lo que la vuelve totalmente estéril. Es que en el lugar del ejercicio de la creación de lo nuevo (exigido por la vida), la imaginación pasa a reducirse al ejercicio de su capacidad creativa (disociada de la vida) para producir novedades, las cuales multiplican las oportunidades para las inversiones de capital y excitan la voluntad de consumo en una velocidad exponencial. ","kind":"suggestion"},{"html":"8. No renunciar al deseo en su ética de afirmación de la vida, lo cual implica mantenerla lo más posible fecunda a cada momento, fluyendo en su proceso ilimitado de diferenciación de formas y valores.","text":"8. No renunciar al deseo en su ética de afirmación de la vida, lo cual implica mantenerla lo más posible fecunda a cada momento, fluyendo en su proceso ilimitado de diferenciación de formas y valores.","kind":"suggestion"},{"html":"9. No negociar lo innegociable: todo aquello que obstaculiza la afirmación de la vida, en su esencia de potencia de creación. Aprender a distinguirlo de lo negociable: todo aquello que se podría aceptar y reajustar porque no debilita la fuerza vital instituyente sino que, por el contrario, genera las condiciones objetivas para que se produzca un acontecimiento, cumpliéndose así su destino ético. ","text":"9. No negociar lo innegociable: todo aquello que obstaculiza la afirmación de la vida, en su esencia de potencia de creación. Aprender a distinguirlo de lo negociable: todo aquello que se podría aceptar y reajustar porque no debilita la fuerza vital instituyente sino que, por el contrario, genera las condiciones objetivas para que se produzca un acontecimiento, cumpliéndose así su destino ético. ","kind":"suggestion"},{"html":"10. Practicar el pensamiento en su plena función: indisociablemente ética, estética, política, crítica y clínica. Es decir, re-imaginar el mundo en cada gesto, palabra, relación con el otro (humano y no humano), modo de existir –siempre que la vida así lo exija– (pág 175-177). ","text":"10. Practicar el pensamiento en su plena función: indisociablemente ética, estética, política, crítica y clínica. Es decir, re-imaginar el mundo en cada gesto, palabra, relación con el otro (humano y no humano), modo de existir –siempre que la vida así lo exija– (pág 175-177). ","kind":"suggestion"}],"bibliography":[{"html":"Horkheimer, M., &amp; Adorno, T. W. (1998). <em>Dialéctica de la Ilustración: Fragmentos filosóficos</em> (J. J. Sánchez, Trad.; 3.ª ed.). Trotta.","text":"Horkheimer, M., & Adorno, T. W. (1998). Dialéctica de la Ilustración: Fragmentos filosóficos (J. J. Sánchez, Trad.; 3.ª ed.). Trotta."},{"html":"Rolnik, S. (2019). <em>Esferas de la insurrección</em> (C. Palmeiro, M. Cabrera, &amp; D. Kraus, Trads.). Tinta Limón.","text":"Rolnik, S. (2019). Esferas de la insurrección (C. Palmeiro, M. Cabrera, & D. Kraus, Trads.). Tinta Limón."}]},{"id":"oyewumi","name":"Oyèrónkẹ Oyěwùmí","concept":{"es":"Género","ca":"Gènere"},"color":"#ffc857","blocks":[{"html":"Para adentrarnos en la complejidad de la mujer como concepto, podemos acudir a varios sitios. Por ejemplo, al psicoanálisis, comenzando con Freud y su discurso sobre la feminidad hasta con Lacan. Este último en el <em>Seminario 20: Aún </em>trata la cuestión de la mujer, o, mejor dicho, de la posición femenina. En este seminario nos dice que:","text":"Para adentrarnos en la complejidad de la mujer como concepto, podemos acudir a varios sitios. Por ejemplo, al psicoanálisis, comenzando con Freud y su discurso sobre la feminidad hasta con Lacan. Este último en el Seminario 20: Aún trata la cuestión de la mujer, o, mejor dicho, de la posición femenina. En este seminario nos dice que:","kind":"paragraph"},{"html":"<em>La</em> mujer sólo [sic] puede escribirse tachando <em>La</em><em>. </em>No hay <em>La</em> mujer, artículo definido para designar el universal. No hay <em>La</em> mujer puesto que —ya antes me permití el término, por qué tener reparos ahora— por esencia ella no toda es (Lacan, 2008, p. 89). ","text":"La mujer sólo [sic] puede escribirse tachando La. No hay La mujer, artículo definido para designar el universal. No hay La mujer puesto que —ya antes me permití el término, por qué tener reparos ahora— por esencia ella no toda es (Lacan, 2008, p. 89). ","kind":"quote"},{"html":"Lacan huye de los esencialismos. Por ello debemos entender <em>La</em> mujer como la posición femenina, que lo pueden ocupar tanto el sexo masculino como el femenino. Por ello en el psicoanálisis lacaniano no importa realmente si tienes genitales masculinos o femeninos. Lo que importa, dejando a parte el dispositivo sexo-género, es en qué posición te colocas. Así, se podría afirmar tal como hace Lacan que <em>La</em> mujer no existe, sino que existen las mujeres, una a una.  ","text":"Lacan huye de los esencialismos. Por ello debemos entender La mujer como la posición femenina, que lo pueden ocupar tanto el sexo masculino como el femenino. Por ello en el psicoanálisis lacaniano no importa realmente si tienes genitales masculinos o femeninos. Lo que importa, dejando a parte el dispositivo sexo-género, es en qué posición te colocas. Así, se podría afirmar tal como hace Lacan que La mujer no existe, sino que existen las mujeres, una a una.  ","kind":"paragraph"},{"html":"La pregunta que se vuelve relevante es ¿existen las mujeres? Este tema ha sido cuestión de debate en Occidente desde hace varias décadas. La cuestión empezó con el psicoanálisis, pero tomó su relevancia con el nacimiento de los estudios queer, inaugurados por Judith Butler en los 90 cuando desmontó el binarismo sexo-género afirmando que el sexo también es construido y no solo el género. ¿Ser “mujer” es una performance?  O ¿acaso será como decía Wittig y solo serán las lesbianas las que no serán mujeres? ","text":"La pregunta que se vuelve relevante es ¿existen las mujeres? Este tema ha sido cuestión de debate en Occidente desde hace varias décadas. La cuestión empezó con el psicoanálisis, pero tomó su relevancia con el nacimiento de los estudios queer, inaugurados por Judith Butler en los 90 cuando desmontó el binarismo sexo-género afirmando que el sexo también es construido y no solo el género. ¿Ser “mujer” es una performance?  O ¿acaso será como decía Wittig y solo serán las lesbianas las que no serán mujeres? ","kind":"paragraph"},{"html":"Otra cuestión es si podemos extrapolar la categoría de mujer a otras culturas/sociedades no occidentales. Para la autora de esta sección, Oyèrónkẹ Oyěwùmí, no podemos. Autora del libro <em>La invención de las mujeres. Una perspectiva africana sobre los discursos </em><em>occidentales del género </em>(2023), nos hace un análisis de la cultura ọ̀yọ́-yorùbá precolonial, en donde no existían las mujeres como concepto.  ","text":"Otra cuestión es si podemos extrapolar la categoría de mujer a otras culturas/sociedades no occidentales. Para la autora de esta sección, Oyèrónkẹ Oyěwùmí, no podemos. Autora del libro La invención de las mujeres. Una perspectiva africana sobre los discursos occidentales del género (2023), nos hace un análisis de la cultura ọ̀yọ́-yorùbá precolonial, en donde no existían las mujeres como concepto.  ","kind":"paragraph"},{"html":"El tema central del libro es desmontar la idea de universalidad en torno al concepto de mujer. Aunque Oyěwùmí no rechace la existencia de jerarquías en la sociedad ọ̀yọ́-yorùbá precolonial, afirma que «la identidad social era relacional y no esencialista» (pág 46). La autora empieza hablando de la persistencia del oculocentrismo en Occidente. «La razón por la que el cuerpo ha sido tan relevante en Occidente es que el mundo se percibe ante todo por la vista» (pág 57). Así, afirma que «solo se percibe como encarnadas a las mujeres; los hombres no tienen cuerpos —son mentes andantes» (pág 64). ","text":"El tema central del libro es desmontar la idea de universalidad en torno al concepto de mujer. Aunque Oyěwùmí no rechace la existencia de jerarquías en la sociedad ọ̀yọ́-yorùbá precolonial, afirma que «la identidad social era relacional y no esencialista» (pág 46). La autora empieza hablando de la persistencia del oculocentrismo en Occidente. «La razón por la que el cuerpo ha sido tan relevante en Occidente es que el mundo se percibe ante todo por la vista» (pág 57). Así, afirma que «solo se percibe como encarnadas a las mujeres; los hombres no tienen cuerpos —son mentes andantes» (pág 64). ","kind":"paragraph"},{"html":"Oyěwùmí lo que afirma es que el discurso feminista global se sustenta en una presuposición de que «las ideas biológicas y las sociales pueden separarse y aplicarse de manera universal» (pág 70). «Así, siendo el género una construcción social, también es un fenómeno histórico y cultural. Entonces, resulta lógico suponer que en algunas sociedades la construcción de género jamás llegó a suceder» (pág 71). ","text":"Oyěwùmí lo que afirma es que el discurso feminista global se sustenta en una presuposición de que «las ideas biológicas y las sociales pueden separarse y aplicarse de manera universal» (pág 70). «Así, siendo el género una construcción social, también es un fenómeno histórico y cultural. Entonces, resulta lógico suponer que en algunas sociedades la construcción de género jamás llegó a suceder» (pág 71). ","kind":"paragraph"},{"html":"La autora nigeriana afirma que en la cultura ọ̀yọ́-yorùbá precolonial lo que primaba no era el dispositivo sexo-género, sino el de la senioridad. La jerarquía era que los más mayores mandaban sobre los más jóvenes. Así la senioridad «es relacional y dinámico y, a diferencia del género, no se centra en el cuerpo» (pág 78). Así como «nadie está de forma permanente en una posición de mayor o menor edad; todo dependerá de quién esté presente en cada situación específica» (pág 126), es más dinámica, no como en el patriarcado, que al nacer mujer, ya se encuentra subordinada a los hombres. Esto se refleja en el lenguaje, ya que «el lenguaje yorùbá está libre de género» (pág 103). Aunque es cierto que sí que diferenciaban anatómicamente a los machos de las hembras en su idioma (usando <em>obìnrin</em> y <em>ọkùnrin</em><em> </em>para macho y hembra respectivamente) (pág 114). Estas palabras no connotaban absolutamente nada más allá de la anatomía humana. De hecho, «las <em>obìnrin</em> no tenían intereses colectivos como grupo debido a que no constituían una categoría social» (pág 154). ","text":"La autora nigeriana afirma que en la cultura ọ̀yọ́-yorùbá precolonial lo que primaba no era el dispositivo sexo-género, sino el de la senioridad. La jerarquía era que los más mayores mandaban sobre los más jóvenes. Así la senioridad «es relacional y dinámico y, a diferencia del género, no se centra en el cuerpo» (pág 78). Así como «nadie está de forma permanente en una posición de mayor o menor edad; todo dependerá de quién esté presente en cada situación específica» (pág 126), es más dinámica, no como en el patriarcado, que al nacer mujer, ya se encuentra subordinada a los hombres. Esto se refleja en el lenguaje, ya que «el lenguaje yorùbá está libre de género» (pág 103). Aunque es cierto que sí que diferenciaban anatómicamente a los machos de las hembras en su idioma (usando obìnrin y ọkùnrin para macho y hembra respectivamente) (pág 114). Estas palabras no connotaban absolutamente nada más allá de la anatomía humana. De hecho, «las obìnrin no tenían intereses colectivos como grupo debido a que no constituían una categoría social» (pág 154). ","kind":"paragraph"},{"html":"También habla de la incorporación al linaje. «Nacimiento para <em>ọkọ</em> y matrimonio para <em>aya</em>» (pág 130). Aún queriendo reivindicar la cultura ọ̀yọ́-yorùbá precolonial como algo no patriarcal ni machista, Oyěwùmí afirma que «el pago de la dote confería acceso sexual y paternidad» (pág 139). Aunque existiera el matrimonio, Oyěwùmí declara que: ","text":"También habla de la incorporación al linaje. «Nacimiento para ọkọ y matrimonio para aya» (pág 130). Aún queriendo reivindicar la cultura ọ̀yọ́-yorùbá precolonial como algo no patriarcal ni machista, Oyěwùmí afirma que «el pago de la dote confería acceso sexual y paternidad» (pág 139). Aunque existiera el matrimonio, Oyěwùmí declara que: ","kind":"paragraph"},{"html":"El sistema de herencia se arraigaba en la idea de que solo heredarían entre sí quienes mantuvieran relaciones consanguíneas. Los principales beneficiarios y beneficiarias eran los retoños, las hermanas y los hermanos de quien fallecía (pág 147). ","text":"El sistema de herencia se arraigaba en la idea de que solo heredarían entre sí quienes mantuvieran relaciones consanguíneas. Los principales beneficiarios y beneficiarias eran los retoños, las hermanas y los hermanos de quien fallecía (pág 147). ","kind":"quote"},{"html":"Así al esposo/a no le correspondía nada. Por otro lado, «en la concepción yorùbá original no existe una idea de trabajo basada en el género» (pág 160). Tras exponer esto, Oyěwùmí hace una declaración demoledora como esta: «La exportación mundial de teoría feminista es parte del proceso de promoción de las normas y valores occidentales» (pág 181). Es decir, que en la sociedad yoruba precolonial no tenía sentido el feminismo ya que las mujeres no eran oprimidas ni subordinadas por el hecho de ser mujeres, pero que luego con el colonialismo esto cambió y se les introdujo el problema y la solución, a saber, el patriarcado y el feminismo occidental. ","text":"Así al esposo/a no le correspondía nada. Por otro lado, «en la concepción yorùbá original no existe una idea de trabajo basada en el género» (pág 160). Tras exponer esto, Oyěwùmí hace una declaración demoledora como esta: «La exportación mundial de teoría feminista es parte del proceso de promoción de las normas y valores occidentales» (pág 181). Es decir, que en la sociedad yoruba precolonial no tenía sentido el feminismo ya que las mujeres no eran oprimidas ni subordinadas por el hecho de ser mujeres, pero que luego con el colonialismo esto cambió y se les introdujo el problema y la solución, a saber, el patriarcado y el feminismo occidental. ","kind":"paragraph"},{"html":"También, se señala que la historiografía (mayoritariamente en inglés), ha tendido a interpretar las respuestas que obtenía del pueblo yorùbá atribuyéndoles género, por ejemplo, a la categoría de gobernante (<em>aláàfin</em>), tratándolos siempre en masculino. «Tanto anamachos como anahembras se reconocen como fundadoras de linajes y ciudades» (pág 201). Cuando menciona anamachos/anahembras, Oyěwùmí se refiere a lo que comúnmente denominamos en Occidente el sexo masculino y femenino. ","text":"También, se señala que la historiografía (mayoritariamente en inglés), ha tendido a interpretar las respuestas que obtenía del pueblo yorùbá atribuyéndoles género, por ejemplo, a la categoría de gobernante (aláàfin), tratándolos siempre en masculino. «Tanto anamachos como anahembras se reconocen como fundadoras de linajes y ciudades» (pág 201). Cuando menciona anamachos/anahembras, Oyěwùmí se refiere a lo que comúnmente denominamos en Occidente el sexo masculino y femenino. ","kind":"paragraph"},{"html":"Conectando el planteamiento de Oyěwùmí con el de Suely vemos que es la colonización la que produjo y, en términos deleuzianos, reterritorializó el cómo se veía el género. Fue el inconsciente colonial-capitalístico, tal como ella denominaba, el que se impuso. El cortar por el mismo lado la banda de Möbius. Se podría decir que se colonizó el inconsciente del pueblo yorùbá. Esencializando y naturalizando las categorías rígidas de género binarias. Instituyendo la opresión de las mujeres y el patriarcado. En palabras de la autora, «el mismo proceso que clasificó y redujo a las anahembras africanas a «mujeres» las volvió no elegibles para los papeles de liderazgo» (pág 254). ","text":"Conectando el planteamiento de Oyěwùmí con el de Suely vemos que es la colonización la que produjo y, en términos deleuzianos, reterritorializó el cómo se veía el género. Fue el inconsciente colonial-capitalístico, tal como ella denominaba, el que se impuso. El cortar por el mismo lado la banda de Möbius. Se podría decir que se colonizó el inconsciente del pueblo yorùbá. Esencializando y naturalizando las categorías rígidas de género binarias. Instituyendo la opresión de las mujeres y el patriarcado. En palabras de la autora, «el mismo proceso que clasificó y redujo a las anahembras africanas a «mujeres» las volvió no elegibles para los papeles de liderazgo» (pág 254). ","kind":"paragraph"},{"html":"En síntesis: ","text":"En síntesis: ","kind":"paragraph"},{"html":"El sistema precolonial de senioridad había sido desplazado por un sistema europeo de jerarquía sexual en el que las hembras siempre serían inferiores y estarían subordinadas a los machos. La manifestación definitiva de este nuevo sistema fue un Estado colonial patriarcal que por desgracia sobrevivió a la desaparición del «Imperio» (pág 300). ","text":"El sistema precolonial de senioridad había sido desplazado por un sistema europeo de jerarquía sexual en el que las hembras siempre serían inferiores y estarían subordinadas a los machos. La manifestación definitiva de este nuevo sistema fue un Estado colonial patriarcal que por desgracia sobrevivió a la desaparición del «Imperio» (pág 300). ","kind":"quote"},{"html":"Para matizar también la posición de Oyěwùmí, me remito a Segato (2003) en un artículo suyo en donde critica la idea de que no hubiera subordinación ni patriarcado de las mujeres en el pueblo yorùbá. Me parece especialmente relevante la idea de que al fin y al cabo la sociedad yorùbá es patrilineal, es decir que la <em>aya</em> se muda a la casa del <em>ọkọ</em>. La <em>aya</em><em> </em>es la mujer y todo su linaje, mientras que el <em>ọkọ</em><em> </em>es el marido y todo su linaje (por ello por ejemplo la hermana del marido también sería <em>ọkọ</em>). Aún así, tal como indica Segato (2003), <em>ọkọ</em> y <em>aya</em><em> </em>refieren a «dueño/de dentro y no-dueño/de fuera» respectivamente. Por lo que sigue habiendo una jerarquía entre el <em>ọkọ</em> y la <em>aya</em>, siendo la mujer subordinada al hombre (pág 342). A parte los hombres anatómicos no podían ser nunca <em>aya</em><em> </em>(pág 343). Sin hablar ya de que cuando el marido moría, «solamente los ‘ana-machos’ (<em>anamales</em>) más jóvenes que él en la casa podían reclamar derechos sexuales sobre ella, “<em>en la medida en que éste es un mundo heterosexual</em>” (<em>sic</em>, énfasis mio), y cuando un oko ana-hembra (<em>anafemale</em> sénior) reclamaba derechos de herencia sobre la viuda, el acceso sexual pasaba para uno de sus hijos ana-machos (<em>anamales</em>)» (pág 342). Queda claro que según Segato, la sociedad yorùbá no es tal como Oyěwùmí la describe.     ","text":"Para matizar también la posición de Oyěwùmí, me remito a Segato (2003) en un artículo suyo en donde critica la idea de que no hubiera subordinación ni patriarcado de las mujeres en el pueblo yorùbá. Me parece especialmente relevante la idea de que al fin y al cabo la sociedad yorùbá es patrilineal, es decir que la aya se muda a la casa del ọkọ. La aya es la mujer y todo su linaje, mientras que el ọkọ es el marido y todo su linaje (por ello por ejemplo la hermana del marido también sería ọkọ). Aún así, tal como indica Segato (2003), ọkọ y aya refieren a «dueño/de dentro y no-dueño/de fuera» respectivamente. Por lo que sigue habiendo una jerarquía entre el ọkọ y la aya, siendo la mujer subordinada al hombre (pág 342). A parte los hombres anatómicos no podían ser nunca aya (pág 343). Sin hablar ya de que cuando el marido moría, «solamente los ‘ana-machos’ (anamales) más jóvenes que él en la casa podían reclamar derechos sexuales sobre ella, “en la medida en que éste es un mundo heterosexual” (sic, énfasis mio), y cuando un oko ana-hembra (anafemale sénior) reclamaba derechos de herencia sobre la viuda, el acceso sexual pasaba para uno de sus hijos ana-machos (anamales)» (pág 342). Queda claro que según Segato, la sociedad yorùbá no es tal como Oyěwùmí la describe.     ","kind":"paragraph"}],"bibliography":[{"html":"Lacan, J. (2008). <em>El seminario de Jacques Lacan: Libro 20. Aún</em> (D. Rabinovich, D. Delmont-Mauri, &amp; J. Sucre, Trads.). Paidós.","text":"Lacan, J. (2008). El seminario de Jacques Lacan: Libro 20. Aún (D. Rabinovich, D. Delmont-Mauri, & J. Sucre, Trads.). Paidós."},{"html":"Oyewùmí, O. (2023). <em>La invención de las mujeres: Una perspectiva africana sobre los discursos occidentales del género</em> (A. Montelongo, Trad.). Virus Editorial. (Trabajo original publicado en 1997).","text":"Oyewùmí, O. (2023). La invención de las mujeres: Una perspectiva africana sobre los discursos occidentales del género (A. Montelongo, Trad.). Virus Editorial. (Trabajo original publicado en 1997)."},{"html":"Segato, R. (2003). Género, política e hibridismo en la transnacionalización de la cultura Yoruba. <em>Estudos Afro-Asiáticos, 25</em>(2), 333–363.","text":"Segato, R. (2003). Género, política e hibridismo en la transnacionalización de la cultura Yoruba. Estudos Afro-Asiáticos, 25(2), 333–363."}]},{"id":"ueno","name":"Chizuko Ueno","concept":{"es":"Estatal","ca":"Estatal"},"color":"#68a6ff","blocks":[{"html":"Keith Jenkins, en su libro <em>Repensar la historia </em>(2009), define a la historia como «un discurso, entre muchos otros, sobre el mundo» (pág 7). Más adelante afirma que «el mundo o el pasado nos llega siempre en forma de historias y que no podemos sustraernos de tales historias (narrativas) para comprobar si se corresponden con el mundo o el pasado reales, porque estas narrativas «siempre dadas» constituyen la «realidad»» (pág 12). Justamente es «debido únicamente a la fragilidad epistemológica de la historia. Porque si fuera posible conocer el pasado de una vez por todas, ahora y para siempre, no habría necesidad de que se escribieran más historias, pues ¿acaso tendría sentido que los historiadores relatasen una y otra vez la misma historia del mismo modo?» (pág 14). ","text":"Keith Jenkins, en su libro Repensar la historia (2009), define a la historia como «un discurso, entre muchos otros, sobre el mundo» (pág 7). Más adelante afirma que «el mundo o el pasado nos llega siempre en forma de historias y que no podemos sustraernos de tales historias (narrativas) para comprobar si se corresponden con el mundo o el pasado reales, porque estas narrativas «siempre dadas» constituyen la «realidad»» (pág 12). Justamente es «debido únicamente a la fragilidad epistemológica de la historia. Porque si fuera posible conocer el pasado de una vez por todas, ahora y para siempre, no habría necesidad de que se escribieran más historias, pues ¿acaso tendría sentido que los historiadores relatasen una y otra vez la misma historia del mismo modo?» (pág 14). ","kind":"paragraph"},{"html":"No nos podemos desplazar hacia el pasado. Es imposible, no nos podemos teletransportar. Por ello, tal como explica Meera Nanda (2003), el pasado se tiende a idealizar, sobre todo los mitos sobre los países o, más bien, los actuales Estados-naciones. Nanda (2003) se centra en el caso de la India, pero este planteamiento se puede extrapolar. Desde teóricos como Thomas Hobbes y su famosa obra <em>El Leviatán</em> se formulaba que para poder coexistir en paz tenemos que ceder parte de nuestra autonomía a un soberano porque sino estaríamos en un estado de guerra absoluto, todos contra todos, esto sería el estado de naturaleza. Lo que plantea Hobbes es un contrato social. Esto llega hasta el punto de que filósofos que nos son más contemporáneos como Max Weber, postularon la idea de que el Estado es el que tiene el monopolio de la violencia justificada. Una pregunta que nos puede surgir es, ¿quién ha firmado ese contrato social y por cuánto tiempo se ha firmado? No parece plausible que se pueda volver a someter a escrutinio la forma de gobierno que deseamos. De hecho, películas como <em>La Purga</em><em> </em>(2013)<em> </em>de James DeMonaco nos recuerdan de lo que podría pasar si no aceptásemos ceder el uso de la violencia al Estado. Esta saga de películas, al más fiel estilo hobbesiano, ejemplifican el estado de naturaleza postulado por este último. ","text":"No nos podemos desplazar hacia el pasado. Es imposible, no nos podemos teletransportar. Por ello, tal como explica Meera Nanda (2003), el pasado se tiende a idealizar, sobre todo los mitos sobre los países o, más bien, los actuales Estados-naciones. Nanda (2003) se centra en el caso de la India, pero este planteamiento se puede extrapolar. Desde teóricos como Thomas Hobbes y su famosa obra El Leviatán se formulaba que para poder coexistir en paz tenemos que ceder parte de nuestra autonomía a un soberano porque sino estaríamos en un estado de guerra absoluto, todos contra todos, esto sería el estado de naturaleza. Lo que plantea Hobbes es un contrato social. Esto llega hasta el punto de que filósofos que nos son más contemporáneos como Max Weber, postularon la idea de que el Estado es el que tiene el monopolio de la violencia justificada. Una pregunta que nos puede surgir es, ¿quién ha firmado ese contrato social y por cuánto tiempo se ha firmado? No parece plausible que se pueda volver a someter a escrutinio la forma de gobierno que deseamos. De hecho, películas como La Purga (2013) de James DeMonaco nos recuerdan de lo que podría pasar si no aceptásemos ceder el uso de la violencia al Estado. Esta saga de películas, al más fiel estilo hobbesiano, ejemplifican el estado de naturaleza postulado por este último. ","kind":"paragraph"},{"html":"De estas dos cuestiones, a saber, de la historia y del Estado-nación es de lo que trata en síntesis Chizuko Ueno en su obra <em>Nationalism</em><em> and Gender </em>(2004). Ueno se centra en la figura de las “mujeres de consuelo” durante la Guerra del Pacífico (1937-1945), guerra en donde Japón se extendió colonizando parte de China y Corea. En esta expansión secuestraron a mujeres y las obligaron a prostituirse con los soldados japoneses. Hubo silencio sobre este hecho hasta que una superviviente coreana, Kim Hak-sun denunció públicamente los hechos perpetrados (pág ix). ","text":"De estas dos cuestiones, a saber, de la historia y del Estado-nación es de lo que trata en síntesis Chizuko Ueno en su obra Nationalism and Gender (2004). Ueno se centra en la figura de las “mujeres de consuelo” durante la Guerra del Pacífico (1937-1945), guerra en donde Japón se extendió colonizando parte de China y Corea. En esta expansión secuestraron a mujeres y las obligaron a prostituirse con los soldados japoneses. Hubo silencio sobre este hecho hasta que una superviviente coreana, Kim Hak-sun denunció públicamente los hechos perpetrados (pág ix). ","kind":"paragraph"},{"html":"Ueno, como Jenkins, afirma que «la historia es algo que siempre está sujeto a revisión por parte de quienes viven en el presente» (pág 3). Su objetivo no es establecer una única verdad (pág 4). De hecho, «nadie consideró que el sistema de mujeres de consuelo fuera un delito hasta que las propias mujeres afectadas se definieron como víctimas y lo reinterpretaron como un delito sexual» (pág 5). Por lo que no se puede hablar de “hechos absolutos” en la historia. Ella distingue tres tipos de escuela en la historia, la de la discontinuidad, la de la continuidad y la neocontinuidad. La primera afirma que «las estructuras sociales opresivas caracterizadas por las prácticas feudales y el sistema imperial fueron eliminadas con la democratización de la posguerra y que comenzó una nueva era» (pág 6). Luego la escuela de la continuidad se basa en «la persistencia del «proyecto de modernización» desde la era Meiji […] En consecuencia, desde la perspectiva de esta escuela de la continuidad, los principios de la democratización de posguerra no fueron simplemente algo impuesto a Japón desde el exterior» (pág 7). Por último, la de la neocontinuidad entiende el belicismo y el surgimiento del Estado-nación como una consecuencia de la modernidad y no por tanto un desvío del proyecto. Esto permite comparar el caso de Japón a otros países (no solo los de las fuerzas del Eje) (pág 9). Ueno se adhiere a esta última escuela. ","text":"Ueno, como Jenkins, afirma que «la historia es algo que siempre está sujeto a revisión por parte de quienes viven en el presente» (pág 3). Su objetivo no es establecer una única verdad (pág 4). De hecho, «nadie consideró que el sistema de mujeres de consuelo fuera un delito hasta que las propias mujeres afectadas se definieron como víctimas y lo reinterpretaron como un delito sexual» (pág 5). Por lo que no se puede hablar de “hechos absolutos” en la historia. Ella distingue tres tipos de escuela en la historia, la de la discontinuidad, la de la continuidad y la neocontinuidad. La primera afirma que «las estructuras sociales opresivas caracterizadas por las prácticas feudales y el sistema imperial fueron eliminadas con la democratización de la posguerra y que comenzó una nueva era» (pág 6). Luego la escuela de la continuidad se basa en «la persistencia del «proyecto de modernización» desde la era Meiji […] En consecuencia, desde la perspectiva de esta escuela de la continuidad, los principios de la democratización de posguerra no fueron simplemente algo impuesto a Japón desde el exterior» (pág 7). Por último, la de la neocontinuidad entiende el belicismo y el surgimiento del Estado-nación como una consecuencia de la modernidad y no por tanto un desvío del proyecto. Esto permite comparar el caso de Japón a otros países (no solo los de las fuerzas del Eje) (pág 9). Ueno se adhiere a esta última escuela. ","kind":"paragraph"},{"html":"Ueno, siguiendo a Anderson afirma que «el estado-nación, al inventar un pueblo homogéneo, creó una ‘comunidad imaginada’ y esta identidad grupal llegó a constituir el núcleo de nuestros conceptos de cultura y nación (Anderson, 1985). Aún hoy seguimos lidiando con las consecuencias de este proyecto de nacionalización» (pág 10). Así, «este libro es un intento de engenerizar [aplicar una categoría de género] al estado-nación» (pág 11). ","text":"Ueno, siguiendo a Anderson afirma que «el estado-nación, al inventar un pueblo homogéneo, creó una ‘comunidad imaginada’ y esta identidad grupal llegó a constituir el núcleo de nuestros conceptos de cultura y nación (Anderson, 1985). Aún hoy seguimos lidiando con las consecuencias de este proyecto de nacionalización» (pág 10). Así, «este libro es un intento de engenerizar [aplicar una categoría de género] al estado-nación» (pág 11). ","kind":"paragraph"},{"html":"Una cuestión relevante es que en el momento en que se reconoce la acción de las mujeres en la historia, ya no se las puede exonerar de la culpa de los crímenes. Esta historia que no mantiene a las mujeres en la posición de víctimas es la que se llama la escuela reflexiva de historia de las mujeres (pág 15). ","text":"Una cuestión relevante es que en el momento en que se reconoce la acción de las mujeres en la historia, ya no se las puede exonerar de la culpa de los crímenes. Esta historia que no mantiene a las mujeres en la posición de víctimas es la que se llama la escuela reflexiva de historia de las mujeres (pág 15). ","kind":"paragraph"},{"html":"Ueno, revisando la historia de las pensadoras japonesas de la época menciona a Takamure Itsue, fiel defensora de lo rural y ferviente enemiga de la modernización. En palabras de Ueno, esta idea que sostenía Takamure, del «‘ideal rural’ es en sí mismo una ideología reaccionaria nacida de la oposición a la incipiente era moderna, que genera nostalgia por un pasado inexistente, un punto de vista que no es más que un subproducto de la era moderna» (pág 30). Esto resuena a lo que he comentado en Meera Nanda (2003), esa advertencia hacia la idealización del pasado que se le criticaba al planteamiento de Oyěwùmí (2023). ","text":"Ueno, revisando la historia de las pensadoras japonesas de la época menciona a Takamure Itsue, fiel defensora de lo rural y ferviente enemiga de la modernización. En palabras de Ueno, esta idea que sostenía Takamure, del «‘ideal rural’ es en sí mismo una ideología reaccionaria nacida de la oposición a la incipiente era moderna, que genera nostalgia por un pasado inexistente, un punto de vista que no es más que un subproducto de la era moderna» (pág 30). Esto resuena a lo que he comentado en Meera Nanda (2003), esa advertencia hacia la idealización del pasado que se le criticaba al planteamiento de Oyěwùmí (2023). ","kind":"paragraph"},{"html":"En la guerra los países Aliados y los del Eje tomaron caminos diferentes en lo que viene siendo el papel de las mujeres en la guerra. Mientras que los primeros optaron por un modelo integracionista de género, manteniendo a las mujeres en la retaguardia (pág 50), los segundos optaron por un modelo segregacionista de género, manteniendo a las mujeres en el hogar cuidando de los niños (pág 43). Frente a la estrategia de los países Aliados como EEUU e Inglaterra, la autora se plantea: «Sin embargo, ¿debemos considerar esto como la liberación de la mujer o como la nacionalización definitiva de la mujer?» (pág 51). ","text":"En la guerra los países Aliados y los del Eje tomaron caminos diferentes en lo que viene siendo el papel de las mujeres en la guerra. Mientras que los primeros optaron por un modelo integracionista de género, manteniendo a las mujeres en la retaguardia (pág 50), los segundos optaron por un modelo segregacionista de género, manteniendo a las mujeres en el hogar cuidando de los niños (pág 43). Frente a la estrategia de los países Aliados como EEUU e Inglaterra, la autora se plantea: «Sin embargo, ¿debemos considerar esto como la liberación de la mujer o como la nacionalización definitiva de la mujer?» (pág 51). ","kind":"paragraph"},{"html":"A la hora de juzgar la historia Ueno se pregunta acerca de la etiquetación como “buenas” o “malas” guerras. En sus palabras: ","text":"A la hora de juzgar la historia Ueno se pregunta acerca de la etiquetación como “buenas” o “malas” guerras. En sus palabras: ","kind":"paragraph"},{"html":"Si esto es así, significa que las guerras pueden dividirse en guerras buenas y guerras malas, y la culpabilidad de las mujeres japonesas radica en que no tuvieron la previsión de darse cuenta de que estaban apoyando una guerra mala. <em>Cuando se trata de distinguir entre guerras buenas y malas, ¿cómo se hace</em><em>,</em><em> si no después de los hechos?</em><em> </em>(pág 59, énfasis añadido). ","text":"Si esto es así, significa que las guerras pueden dividirse en guerras buenas y guerras malas, y la culpabilidad de las mujeres japonesas radica en que no tuvieron la previsión de darse cuenta de que estaban apoyando una guerra mala. Cuando se trata de distinguir entre guerras buenas y malas, ¿cómo se hace, si no después de los hechos? (pág 59, énfasis añadido). ","kind":"quote"},{"html":"La historia es fácil juzgarla echando la vista atrás, pero en el momento no es tan fácil. ¿Cómo sabían las mujeres de los países Aliados que estaban apoyando a una guerra “justa”? «El análisis feminista del estado-nación ha dejado claro que la igualdad de género es imposible en principio dentro de un marco de modernidad, patriarcado y estado-nación» (pág 63). El Estado-nación está generizado, las mujeres han sido nacionalizadas. La pregunta que se formula Ueno es, ¿podemos ir más allá? (pág 64). ","text":"La historia es fá
